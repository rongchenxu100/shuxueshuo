[project]
name = "shuxueshuo-server"
version = "0.1.0"
description = "WeChat JS-SDK config API for 数学说"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "celery>=5.6,<5.7",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "jinja2>=3.1",
  "jsonschema>=4.0",
  "openai>=1.0",
  "python-dotenv>=1.0.1",
  "Pillow>=11.0",
  "pypdfium2>=5.0,<6.0",
  "sympy>=1.13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-xdist>=3.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "solver_contract: medium-cost authority, retry, checkpoint, transaction, or recorded replay coverage",
  "solver_full: exhaustive generated matrices or other high-cost offline replay",
  "generated_gate: deterministic generated Solver authority coverage",
  "serial: test mutates shared process or filesystem state and must not use xdist",
  "live_llm: test may call a network or paid LLM provider",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shuxueshuo_server*"]

[tool.setuptools.package-data]
"shuxueshuo_server.solver.explanation" = ["prompts/*.jinja"]
