            <div class="problem-line"><span><span class="problem-source-inline">（2026 江苏苏州实验中学期中）</span>集合 A={x|0≤x≤4}，B={y|0≤y≤2}，下列不能表示从 A 到 B 的函数的是：</span></div>
<div class="problem-line"><span>A. <span class="inline-math">y=<span class="math-fraction"><span class="math-numerator">x</span><span class="math-denominator">2</span></span></span>　　B. <span class="inline-math">y=<span class="math-fraction"><span class="math-numerator">x</span><span class="math-denominator">3</span></span></span>　　C. <span class="inline-math">y=<span class="math-fraction"><span class="math-numerator">2x</span><span class="math-denominator">3</span></span></span>　　D. <span class="inline-math">y=<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">x</span></span></span></span><span class="answer-chip" id="answerI">答案：C</span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">判断是否为从 A 到 B 的函数，需要同时满足：</p><ol><li>对任意 x∈A，都有且只有一个确定的 y 与之对应；</li><li>所有函数值都属于 B，即实际值域 <span class="inline-math">R<sub>f</sub>⊆ B</span>。</li></ol></div></aside>
