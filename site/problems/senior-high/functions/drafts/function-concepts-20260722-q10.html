  <script>
    var STEPS      = [{"id":"s1","section":"求值域","title":"第1步：结合二次函数图像确定值域","t":0,"derive":[["配方","\\(g(t)=-2(t+\\frac{1}{4})^2+\\frac{33}{8}\\)，对称轴为 \\(t=-\\frac{1}{4}\\)"],["区间位置","对称轴位于研究区间 \\([0,+∞)\\) 左侧，所以函数在该区间上单调递减"],["最大值","\\(g(0)=4\\)，因此最大值为 4"],["向右趋势","当 \\(t→+∞\\) 时，\\(g(t)→−∞\\)"],["∴","函数的值域为 \\((−∞,4]\\)"]],"box":["图中只强调 t≥0 的抛物线部分；拖动 t 可观察函数值从 4 开始持续减小"]}];

<script>
  const __FUNCTION_SPEC__ = JSON.parse(document.getElementById('functionSpec').textContent);
  const __FUNCTION_DECORATIONS__ = {"$schema":"../../schemas/function-decorations.schema.json","version":1,"steps":{"s1":{"visiblePanels":["quadratic-graph"],"highlightStudyInterval":true,"showDomain":true,"showRange":true,"showProjection":true}}};
  const renderer = FunctionLessonFromSpec.createSpecRenderer(__FUNCTION_SPEC__, __FUNCTION_DECORATIONS__, STEPS, POLICIES);
  function groupTitle(section) {
    const map = {"求值域":"结合二次函数图像确定值域"};
    return Object.prototype.hasOwnProperty.call(map, section) ? map[section] : section;
  }
  var diagramMarkupFor = renderer.diagramMarkupFor;
  var diagramMarkupForFrame = renderer.diagramMarkupForFrame;
  var drawMini = renderer.drawMini;
  var __LESSON_LEGEND_HTML__ = "<span><i class=\"sw\" style=\"background:var(--paper)\"></i>完整抛物线</span><span><i class=\"sw\" style=\"background:var(--overlap)\"></i>t≥0 的研究部分</span>";
  __LESSON_PARAM_LABEL_FORMATTER__ = function (_index, value, localVars, baseLabel) {
    const state = renderer.resolveStateFor(value, localVars);
    const linkedValue = state.env["gValue"];
    if (!Number.isFinite(linkedValue)) return baseLabel;
    const rounded = Number(linkedValue.toFixed(2));
    return baseLabel + '　' + "g(t)＝" + rounded;
  };
  var __AFTER_RENDER_ALL_STEPS__ = renderer.renderOriginalFigures;
</script>
