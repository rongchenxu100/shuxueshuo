            <div class="problem-line"><span><span class="problem-source-inline">（2026 山东省实验中学期中）</span>已知函数 <span class="inline-math">f(x)=x-1</span>，<span class="inline-math">g(x)=kx<sup>2</sup>-(2k+1)x+k+1</span>，其中 <span class="inline-math">k&gt;1</span>。若对任意 <span class="inline-math">x<sub>1</sub>∈[2,4]</span>，存在 <span class="inline-math">x<sub>2</sub>∈[2,4]</span>，使得 <span class="inline-math">f(x<sub>1</sub>)f(x<sub>2</sub>)=g(x<sub>1</sub>)g(x<sub>2</sub>)</span> 成立，则实数 <span class="inline-math">k</span> 的值等于______。</span><span class="answer-chip" id="answerI">4/3</span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">乘积等式中同时出现 f 和 g 时，先验证函数值不为 0，再构造比值函数；</p><ol><li>把“对任意 x₁，存在 x₂”翻译为值域包含关系，再比较区间端点。</li></ol></div></aside>

  <script>
    var STEPS      = [{"id":"s1","section":"求解","title":"确认可除并构造比值函数","t":0,"showDiagram":false,"derive":[["∵","\\(x∈[2,4]\\)，∴ \\(f(x)=x-1∈[1,3]\\)，即 \\(f(x)≠0\\)"],["又","\\(g(x)\\) 的对称轴为 \\(x=1+\\frac{1}{2k}<\\frac{3}{2}\\)"],["∴","\\(g(x)∈[g(2),g(4)]=[k-1,9k-3]\\)，且 \\(k>1\\)，所以 \\(g(x)>0\\)"],["原式","\\(\\frac{g(x_1)}{f(x_1)}=\\frac{f(x_2)}{g(x_2)}\\)"],["令","\\(h(x)=\\frac{g(x)}{f(x)}=kx-k-1\\)，则 \\(h(x_1)=\\frac{1}{h(x_2)}\\)"]],"box":["先确认分母不为 0，才能把乘积等式改写为比值关系。"]},{"id":"s2","section":"求解","title":"转化值域包含关系并求 k","t":0,"derive":[["∵","\\(k>1\\)，∴ \\(h(x)=kx-k-1\\) 在 \\([2,4]\\) 上单调递增"],["∴","\\(h(x)\\) 在 \\([2,4]\\) 上的值域为 \\([k-1,3k-1]\\)"],["又","\\(\\frac{1}{h(x)}\\) 在 \\([2,4]\\) 上的值域为 \\([\\frac{1}{3k-1},\\frac{1}{k-1}]\\)"],["记","\\(H\\) 表示 \\(h(x)\\) 在 \\([2,4]\\) 上的值域，即 \\(H=[k-1,3k-1]\\)"],["记","\\(J\\) 表示 \\(\\frac{1}{h(x)}\\) 在 \\([2,4]\\) 上的值域，即 \\(J=[\\frac{1}{3k-1},\\frac{1}{k-1}]\\)"],["量词","“对任意 \\(x_1\\)，存在 \\(x_2\\)”表示：\\(H\\) 中的每一个值，都能在 \\(J\\) 中找到"],["∴","\\(H\\subseteq J\\)，即 \\([k-1,3k-1]\\subseteq[\\frac{1}{3k-1},\\frac{1}{k-1}]\\)"],["∴","\\(\\frac{1}{3k-1}≤k-1<3k-1≤\\frac{1}{k-1}\\)"],["即","\\((k-1)(3k-1)≥1\\)，且 \\((k-1)(3k-1)≤1\\)"],["∴","\\((k-1)(3k-1)=1\\)，解得 \\(k=0\\) 或 \\(k=\\frac{4}{3}\\)"],["∵","\\(k>1\\)，∴ \\(k=\\frac{4}{3}\\)"]],"box":["一般地，若对任意 x₁∈I，都存在 x₂∈I 使 p(x₁)=q(x₂)，那么 p(I)⊆q(I)；反过来，值域包含也保证每个 p(x₁) 都能找到相应的 x₂。"]}];
