            <div class="problem-line"><span><span class="problem-source-inline">（2026 江西抚州期中）</span>设集合 M={x|0≤x≤2}，N={y|0≤y≤2}。在下面的 4 个图形中，能表示集合 M 到集合 N 的函数关系的是。</span></div>

<div class="problem-line"><span></span><span class="answer-chip" id="answerI">答案：C</span></div>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">判断关系图是否表示从 M 到 N 的函数，需要同时满足：</p><ol><li>对任意 x∈M，都有且只有一个确定的 y 与之对应；</li><li>所有函数值都属于 N，即实际值域 <span class="inline-math">R<sub>f</sub>⊆ N</span>。</li></ol></div></aside>
