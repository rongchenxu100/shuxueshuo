        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">判断值域是否恰为给定集合，要同时确认：</p><ol><li>函数值不会超出目标集合；</li><li>目标集合中的每一个值都能够由定义域内某个输入取得；</li><li>根据函数结构选择求值域方法：基本不等式、配方法、分母范围或基本函数性质。</li></ol></div></aside>

  <script>
    var STEPS      = [{"id":"s1","section":"逐项判断","title":"第1步：用基本不等式求选项 A 的值域","t":1,"derive":[["基本不等式","若 \\(a>0，b>0\\)，则 \\(a+b≥2\\sqrt{ab}\\)"],["当 x>0","令 \\(a=x，b=\\frac{1}{x}\\)，则 \\(a>0，b>0\\)，且 \\(ab=x·\\frac{1}{x}=1\\)"],["代入化简","\\(x+\\frac{1}{x}≥2\\sqrt{x·\\frac{1}{x}}=2\\sqrt{1}=2\\)"],["取等条件","\\(x=\\frac{1}{x}\\)，即 \\(x^2=1\\)；结合 \\(x>0\\)，得 \\(x=1\\)"],["当 x<0","令 \\(u=-x>0\\)，则 \\(x+\\frac{1}{x}=-(u+\\frac{1}{u})≤-2\\)，当且仅当 \\(x=-1\\) 取等"],["∴","值域为 \\((−∞,−2]∪[2,+∞)\\)，不是 \\((0,+∞)\\)"]],"box":["使用基本不等式前先确认两项均为正；自变量可正可负时，需要分类讨论"]},{"id":"s2","section":"逐项判断","title":"第2步：用配方法求选项 B 的值域","t":1,"derive":[["配方","\\(x^2+x+1=(x+\\frac{1}{2})^2+\\frac{3}{4}≥\\frac{3}{4}\\)"],["取等","当 \\(x=-\\frac{1}{2}\\) 时取得最小值 \\(\\frac{3}{4}\\)"],["∴","值域为 \\([\\frac{3}{4},+∞)\\)，不是 \\((0,+∞)\\)"]],"box":["函数恒为正，不代表它能取得每一个正实数"]},{"id":"s3","section":"逐项判断","title":"第3步：由分母范围求选项 C 的值域","t":1,"derive":[["∵","\\(x^2≥0\\)，所以 \\(x^2+1≥1\\)"],["∴","\\(0<\\frac{1}{x^2+1}≤1\\)，且 \\(x=0\\) 时取到 1"],["值域","\\((0,1]\\)，不是 \\((0,+∞)\\)"]],"box":["分母没有上界，所以函数值可以无限接近 0，但不能等于 0"]},{"id":"s4","section":"逐项判断","title":"第4步：由基本函数性质判断选项 D","t":1,"derive":[["定义域","\\(x>0\\)，所以 \\(y=\\frac{1}{\\sqrt{x}}>0\\)"],["任取正数","对任意 \\(y_0>0\\)，取 \\(x=\\frac{1}{y_0^2}>0\\)，就有 \\(\\frac{1}{\\sqrt{x}}=y_0\\)"],["∴","每一个正实数都能取得，值域为 \\((0,+∞)\\)，答案为 D"]],"box":["拖动 x 可以核对变化趋势，值域结论仍由定义域和代数关系确定"]}];
    var STEP_LABELS = {"s1":"1 A：基本不等式","s2":"2 B：配方法","s3":"3 C：分母范围","s4":"4 D：基本函数性质"};
    var POLICIES   = {"s1":{"movable":false,"range":[1,1]},"s2":{"movable":false,"range":[1,1]},"s3":{"movable":false,"range":[1,1]},"s4":{"movable":true,"range":[0.05,4],"step":0.01}};
