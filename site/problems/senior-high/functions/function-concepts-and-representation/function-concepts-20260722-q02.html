            <div class="problem-line"><span>下列各组函数表示同一个函数的是：</span></div>
<div class="problem-line"><span>A. <span class="inline-math">f(x)=<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">-2x<sup>3</sup></span></span></span>，<span class="inline-math">g(x)=x<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">-2x</span></span></span></span></div>
<div class="problem-line"><span>B. <span class="inline-math">f(x)=x</span>，<span class="inline-math">g(x)=<span class="math-fraction"><span class="math-numerator">x<sup>2</sup></span><span class="math-denominator">x</span></span></span></span></div>
<div class="problem-line"><span>C. <span class="inline-math">f(x)=x<sup>2</sup>-2x-1</span>，<span class="inline-math">g(t)=t<sup>2</sup>-2t-1</span></span></div>
<div class="problem-line"><span>D. <span class="inline-math">f(x)=<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">x-1</span></span><span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">x+1</span></span></span>，<span class="inline-math">g(x)=<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">(x+1)(x-1)</span></span></span></span><span class="answer-chip" id="answerI">答案：C</span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">判断两个函数是否相同，必须同时检查：</p><ol><li>定义域是否完全相同；</li><li>在相同定义域内，对应关系是否相同。自变量字母不同不影响函数相同。</li></ol></div></aside>
