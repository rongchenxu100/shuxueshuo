            <div class="problem-line"><span>集合 <span class="inline-math">A={x| x<sup>2</sup>-4x+3≤0}</span>，<span class="inline-math">B={x| x&gt;m}</span>。若“<span class="inline-math">x∈C<sub><span class="math-blackboard">ℝ</span></sub>A</span>”是“<span class="inline-math">x∈B</span>”的必要不充分条件，则实数 <span class="inline-math">m</span> 的取值范围是（　　）</span></div>
<div class="problem-line"><span></span><span class="answer-chip" id="answerI">答案：C</span></div>
<div class="problem-options"><div class="problem-option"><span class="problem-option-label">A.</span><span><span class="inline-math">(-∞,1)</span></span></div><div class="problem-option"><span class="problem-option-label">B.</span><span><span class="inline-math">[1,3]</span></span></div><div class="problem-option"><span class="problem-option-label">C.</span><span><span class="inline-math">[3,+∞)</span></span></div><div class="problem-option"><span class="problem-option-label">D.</span><span><span class="inline-math">[2,3]</span></span></div></div>
