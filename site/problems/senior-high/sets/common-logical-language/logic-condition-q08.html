            <div class="problem-line"><span>已知集合 <span class="inline-math">A={x|-2≤ x≤2}</span>，<span class="inline-math">B={x|-3≤ x≤2}</span>，则“<span class="inline-math">x∈ A</span>”是“<span class="inline-math">x∈ B</span>”的 ______ 条件。（填“充分”或“必要”）</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">充分</span></span></div>
          </div>
        </section>
