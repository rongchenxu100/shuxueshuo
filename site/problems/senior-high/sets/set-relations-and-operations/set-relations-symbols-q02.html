<div class="problem-line"><span>① <span class="inline-math">A={x| x&gt;1}</span> ___ <span class="inline-math">B={x| x&gt;2}</span>；</span></div>
<div class="problem-line"><span>② <span class="inline-math">A={y| y=x<sup>2</sup>}</span> ___ <span class="inline-math">B={y| y=x<sup>2</sup>+x}</span>；</span></div>
<div class="problem-line"><span>③ <span class="inline-math">A={y| y=-x<sup>2</sup>}</span> ___ <span class="inline-math">B={y| y=-x<sup>2</sup>+x}</span>。</span><span class="answer-chip" id="answerI">答案：⊋，⊊，⊊</span></div>
