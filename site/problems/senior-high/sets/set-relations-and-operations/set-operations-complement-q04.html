            <div class="problem-line"><span><span class="problem-source-inline">（2025 秋·南开区校级月考）</span>已知集合 <span class="inline-math">A={x|1&lt;x&lt;3}</span>，<span class="inline-math">B={x|2m&lt;x&lt;1-m}</span>。</span></div>
<div class="problem-line"><span>（1）当 <span class="inline-math">m=-1</span> 时，求 <span class="inline-math">A∪ B</span>；（2）若 <span class="inline-math">A⊆ B</span>，求实数 <span class="inline-math">m</span> 的取值范围；（3）若 <span class="inline-math">A∩ B=∅</span>，求实数 <span class="inline-math">m</span> 的取值范围。</span><span class="answer-chip" id="answerI">答案：（1）<span class="inline-math">(-2,3)</span>；（2）<span class="inline-math">m≤-2</span>；（3）<span class="inline-math">m≥0</span></span></div>
          </div>

  <script>
    var STEPS      = [{"id":"s1","section":"补集","title":"代入 m=-1 求并集","t":0,"showDiagram":false,"visual":{"kind":"number-line-parameter-union","ariaLabel":"数轴上集合 A 是一到三的开区间，m 等于负一时集合 B 是负二到二的开区间，并集是负二到三"},"reasoning":[{"kind":"because","text":"当 \\(m=-1\\) 时，\\(B=(-2,2)\\)，而 \\(A=(1,3)\\)"},{"kind":"therefore","text":"两个区间在 \\((1,2)\\) 重叠，所以 \\(A\\cup B=(-2,3)\\)"}],"derive":[["第（1）问","\\((-2,3)\\)"]]},{"id":"s2","section":"补集","title":"由 A⊆B 比较端点","t":1,"showDiagram":false,"visual":{"kind":"number-line-parameter-containment","ariaLabel":"数轴上开区间 A 从一到三，要包含在开区间 B 从 2m 到 1 减 m 中，B 的左右端点必须分别不超过一且不小于三"},"reasoning":[{"kind":"because","text":"要使 \\((1,3)\\subseteq(2m,1-m)\\)，需 \\(2m\\le1\\) 且 \\(1-m\\ge3\\)"},{"kind":"therefore","text":"两条件合并得 \\(m\\le-2\\)；端点相等时两个集合都不取该端点，仍可满足包含"}],"derive":[["第（2）问","\\((-∞,-2]\\)"]]},{"id":"s3","section":"补集","title":"分类讨论 A∩B=∅","t":2,"showDiagram":false,"visual":{"kind":"number-line-parameter-disjoint","ariaLabel":"数轴上集合 A 是一到三的开区间。集合 B 为空时自动无交集；集合 B 非空时分别检验停在 A 左侧和停在 A 右侧，右侧情形无解"},"table":{"headers":["情形","条件","结论"],"rows":[["B 为空","\\(2m\\ge1-m\\)","\\(m\\ge\\frac{1}{3}\\)"],["B 非空且在 A 左侧","\\(2m<1-m\\) 且 \\(1-m\\le1\\)","\\(0\\le m<\\frac{1}{3}\\)"],["B 非空且在 A 右侧","\\(2m<1-m\\) 且 \\(2m\\ge3\\)","条件矛盾，无解"]]},"reasoning":[{"kind":"because","text":"B 非空要求 \\(2m<1-m\\)；与 A 无交集时，B 还需整体位于 A 左侧或右侧。左侧得到 \\(0\\le m<\\frac{1}{3}\\)，右侧要求 \\(m\\ge\\frac{3}{2}\\) 且 \\(m<\\frac{1}{3}\\)，条件矛盾"},{"kind":"therefore","text":"再与 B 为空时的参数范围取并集：\\([0,\\frac{1}{3})\\cup[\\frac{1}{3},+\\infty)=[0,+\\infty)\\)"}],"derive":[["第（3）问","\\([0,+\\infty)\\)"]]}];
