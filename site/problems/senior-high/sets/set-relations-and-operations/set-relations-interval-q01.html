            <div class="problem-line"><span>设集合 <span class="inline-math">A={x| -2&lt;x≤5}</span>，<span class="inline-math">B={x| m+1≤ x≤2m-1}</span>，<span class="inline-math">B⊆ A</span>，则 <span class="inline-math">m</span> 的取值范围为 ___。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">m≤3</span></span></div>

        </section>
