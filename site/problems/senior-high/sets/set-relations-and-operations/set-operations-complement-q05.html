<div class="problem-line"><span>（1）若 <span class="inline-math">(C<sub><span class="math-blackboard">ℝ</span></sub>A)∪ B=<span class="math-blackboard">ℝ</span></span>，求实数 <span class="inline-math">a</span> 的取值范围；（2）若 <span class="inline-math">A∩ B≠ B</span>，求实数 <span class="inline-math">a</span> 的取值范围。</span><span class="answer-chip" id="answerI">答案：（1）<span class="inline-math">a≤0</span>；（2）<span class="inline-math">a&lt;1/2</span></span></div>
