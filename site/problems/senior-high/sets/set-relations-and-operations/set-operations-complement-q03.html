<div class="problem-line"><span>（1）<span class="inline-math">C<sub>U</sub>(A∪ B)</span>；（2）<span class="inline-math">(C<sub><span class="math-blackboard">ℝ</span></sub>A)∩ B</span>。</span><span class="answer-chip" id="answerI">答案：（1）<span class="inline-math">(-∞,-1)∪(4,5]</span>；（2）<span class="inline-math">[-1,1)∪(2,4]</span></span></div>
