          <div class="problem-full">
            <div class="problem-line"><span>已知集合 <span class="inline-math">A={x| x<sup>2</sup>-4x-5≥0}</span>，<span class="inline-math">B={x|2a≤ x≤ a+2}</span>。若 <span class="inline-math">A∩ B=B</span>，求实数 <span class="inline-math">a</span> 的取值范围。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">a≤-3或a&gt;2</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead"><span class="inline-math">A∩ B=B</span> 等价于 <span class="inline-math">B⊆ A</span>。</p><ol><li>第一步单独讨论 <span class="inline-math">B</span> 是否为空集。</li><li><span class="inline-math">B</span> 非空时，连续区间必须整体落在 <span class="inline-math">A</span> 的左支或右支；分类所得参数集合最后取并集。</li></ol></div></aside>

      </div>

  <!-- 第一段：页面数据（var 声明，跨脚本块全局可见） -->
  <script>
    var STEPS      = [{"id":"s1","section":"交集","title":"先讨论 B 为空集","t":0,"showDiagram":false,"reasoning":[{"kind":"because","text":"\\(A\\cap B=B\\) 等价于 \\(B\\subseteq A\\)；当 \\(B=\\varnothing\\) 时，空集自动是 \\(A\\) 的子集"},{"kind":"therefore","text":"由 \\(2a>a+2\\) 得 \\(a>2\\)，这是空集情形得到的参数集合 \\((2,+\\infty)\\)"}],"derive":[["空集情形","\\(a>2\\)"]]},{"id":"s2","section":"交集","title":"B 非空且落在 A 的左支","t":0,"showDiagram":false,"visual":{"kind":"number-line-subset-left-branch","ariaLabel":"数轴上集合 A 是负无穷到负一以及五到正无穷，非空区间 B 整体落在 A 的左支"},"reasoning":[{"kind":"because","text":"\\(B\\ne\\varnothing\\) 时有 \\(2a\\le a+2\\)，即 \\(a\\le2\\)；又 \\(A=(-∞,-1]\\cup[5,+\\infty)\\)"},{"kind":"therefore","text":"若 \\(B=[2a,a+2]\\) 整体落在左支，只需最右端满足 \\(a+2\\le-1\\)，所以 \\(a\\le-3\\)"}],"derive":[["左支情形","\\(a\\le-3\\)"]]},{"id":"s3","section":"交集","title":"B 非空且落在 A 的右支","t":0,"showDiagram":false,"visual":{"kind":"number-line-subset-right-branch","ariaLabel":"数轴上非空区间 B 若整体落在集合 A 的右支，需要左端点 2a 不小于 5，但这与 a 不大于 2 矛盾"},"reasoning":[{"kind":"because","text":"若非空区间 \\(B=[2a,a+2]\\) 整体落在右支 \\([5,+\\infty)\\)，必须有 \\(2a\\ge5\\)，即 \\(a\\ge\\frac{5}{2}\\)"},{"kind":"therefore","text":"这与非空条件 \\(a\\le2\\) 矛盾，所以右支情形无解"},{"kind":"therefore","text":"分类讨论得到的参数集合要取并集：\\((-∞,-3]\\cup(2,+\\infty)\\)"}],"derive":[["最终参数范围","\\((-∞,-3]\\cup(2,+\\infty)\\)"]]}];
    var STEP_LABELS = {"s1":"1 讨论空集","s2":"2 非空时落在左支","s3":"3 非空时落在右支并合并"};
    var POLICIES   = {"s1":{"movable":false,"range":[0,0]},"s2":{"movable":false,"range":[0,0]},"s3":{"movable":false,"range":[0,0]}};
    /** 图例 HTML；由 GEOMETRY_SCRIPT 中的脚本块覆盖赋值，默认空字符串 */

    /** 步骤渲染后的回调；由 GEOMETRY_SCRIPT 中的脚本块覆盖赋值 */
    var __AFTER_RENDER_ALL_STEPS__;
    // diagramMarkupFor / drawMini / groupTitle 由下方 GEOMETRY_SCRIPT 提供
  </script>
