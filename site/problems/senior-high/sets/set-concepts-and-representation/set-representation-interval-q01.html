<div class="problem-line"><span>（1）<span class="inline-math">{x| |x|≤1}</span>；（2）<span class="inline-math">{y| y=<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">x</span></span>+2}</span>；（3）<span class="inline-math">{y| y=-x<sup>2</sup>+2x}</span>；（4）<span class="inline-math">{y| y=x<sup>2</sup>-2x+1,x&gt;0}</span>。</span><span class="answer-chip" id="answerI">答案：（1）<span class="inline-math">[-1,1]</span>；（2）<span class="inline-math">[2,∞)</span>；（3）<span class="inline-math">(-∞,1]</span>；（4）<span class="inline-math">[0,∞)</span></span></div>
