            <div class="problem-line"><span>已知集合 <span class="inline-math">A={a<sub>1</sub>,a<sub>2</sub>,…,a<sub>20</sub>}</span>，且 <span class="inline-math">a<sub>k</sub>&gt;0</span>。集合 <span class="inline-math">B={(a,b)| a∈ A,b∈ A,a-b∈ A}</span>，求 B 中元素至多有多少个。</span><span class="answer-chip" id="answerI">答案：190</span></div>
