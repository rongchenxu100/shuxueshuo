  <main class="page page-with-rail" id="main">

        <section class="card problem" id="problemCard">
          <button id="problemToggle" class="problem-toggle" type="button">收起完整题目</button>
          <div class="problem-full">
            <div class="problem-line"><span>若正数 <span class="inline-math">x，y</span> 满足 <span class="inline-math">x<sup>2</sup>+xy-3=0</span>，则 <span class="inline-math">4x+y</span> 的最小值是________。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">6</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><ol><li>观察结构：条件提取公因式得到定积整块 <span class="inline-math">x</span>、<span class="inline-math">x+y</span>，再把目标重组为同一组整块之和 <span class="inline-math">3x+(x+y)</span></li><li>应用基本不等式：识别 <span class="inline-math">3x</span>、<span class="inline-math">x+y</span> 为两个正项，代入基本不等式公式与定积，得到 <span class="inline-math">4x+y≥6</span></li><li>验证取等：两个正项相等且满足原条件 → <span class="inline-math">x=1，y=2</span></li></ol></div></aside>

        <section class="all-steps" id="stepCards" aria-label="完整解题步骤"></section>
      </div>

        </div>

      </aside>
