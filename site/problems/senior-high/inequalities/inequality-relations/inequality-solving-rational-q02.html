        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">引用分式不等式知识点：先移项通分为与 0 比较的标准式，再把分子零点和分母禁值点共同穿针判号。</p><ol><li>先算 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">3x+1</span><span class="math-denominator">2x-1</span></span>-1=<span class="math-fraction"><span class="math-numerator">x+2</span><span class="math-denominator">2x-1</span></span></span>，不能直接在原式两边乘符号未知的分母。</li><li>由 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">a</span><span class="math-denominator">b</span></span>≤0⇔ ab≤0</span> 且 <span class="inline-math">b≠0</span>，转化为整式乘积判号。</li><li>分子零点 −2 因含等号可以取；分母禁值 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">2</span></span></span> 必须排除。</li></ol></div></aside>
