            <div class="problem-line"><span>3. 已知正实数 <span class="inline-math">x，y</span> 满足 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">x</span></span>+<span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">y</span></span>=1</span>，则 <span class="inline-math">x+4y</span> 最小值为　　　　。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">9</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><ol><li>观察结构：目标 <span class="inline-math">x+4y</span> 暂未显形，乘入等于 <span class="inline-math">1</span> 的条件并整理，得到 <span class="inline-math">5+<span class="math-fraction"><span class="math-numerator">x</span><span class="math-denominator">y</span></span>+<span class="math-fraction"><span class="math-numerator">4y</span><span class="math-denominator">x</span></span></span> → 定积求和</li><li>应用基本不等式：识别 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">x</span><span class="math-denominator">y</span></span></span>、<span class="inline-math"><span class="math-fraction"><span class="math-numerator">4y</span><span class="math-denominator">x</span></span></span> 为两个正项，代入基本不等式公式与定积，得到 <span class="inline-math">x+4y≥9</span></li><li>验证取等：两个正项相等且满足原条件 → <span class="inline-math">x=3，y=<span class="math-fraction"><span class="math-numerator">3</span><span class="math-denominator">2</span></span></span></li></ol></div></aside>
