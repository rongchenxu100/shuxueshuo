            <div class="problem-line"><span>3. 已知正实数 <span class="inline-math">x，y</span> 满足 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">x</span></span>+<span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">y</span></span>=1</span>，则 <span class="inline-math">x+4y</span> 最小值为　　　　。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">9</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">求正项和的最小值时，先检查原两项是否定积；若不固定，就从题设中寻找能消去变量的因子构造定积。</p><ol><li>看目标：正项和求最小值，先寻找固定乘积。</li><li>查定积：x·4y=4xy 不固定，原两项不能直接使用基本不等式。</li><li>找线索：条件整体等于 1 且含倒数，可以乘入并消去变量。</li><li>验等号：构造出的两个正项相等，并且满足原条件。</li></ol></div></aside>
