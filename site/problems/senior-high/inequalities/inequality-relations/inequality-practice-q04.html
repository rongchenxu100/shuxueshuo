            <div class="problem-line"><span>4. 若关于 <span class="inline-math">x</span> 的一元二次不等式 <span class="inline-math">x<sup>2</sup>-6x+a≤0\ (a∈<span class="math-blackboard">ℤ</span>)</span> 的解集中有且仅有 3 个整数，则 <span class="inline-math">a</span> 的取值可以是（　　）</span></div>
<div class="problem-line"><span></span><span class="answer-chip" id="answerI">答案：C</span></div>
<div class="problem-options"><div class="problem-option"><span class="problem-option-label">A.</span><span>4</span></div><div class="problem-option"><span class="problem-option-label">B.</span><span>5</span></div><div class="problem-option"><span class="problem-option-label">C.</span><span>8</span></div><div class="problem-option"><span class="problem-option-label">D.</span><span>9</span></div></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">先利用对称轴锁定三个整数解，再检查最内侧解点与相邻排除点。</p><ol><li>参数 a 只让抛物线上下平移，对称轴始终是 x=3。</li><li>恰有三个整数解时，关于 3 对称的整数只能是 2、3、4。</li><li>含等号的内侧点要保留，相邻外侧点必须排除。</li></ol></div></aside>
