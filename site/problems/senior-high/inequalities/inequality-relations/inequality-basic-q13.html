          <div class="problem-full">
            <div class="problem-line"><span>已知正实数 <span class="inline-math">a，b</span> 满足 <span class="inline-math">(a+1)(b+2)=16</span>，求 <span class="inline-math">a+b</span> 的最小值。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">5</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><ol><li>观察结构：题设已经给出两个完整因式 <span class="inline-math">a+1</span>、<span class="inline-math">b+2</span> 的定积，目标 <span class="inline-math">a+b</span> 还没有对齐这两个因式</li><li>应用基本不等式：对照条件中的完整正项配凑目标，得到 <span class="inline-math">a+b=[(a+1)+(b+2)]-3</span>，再对括号内两项求和</li><li>验证取等：两个完整因式相等且满足 <span class="inline-math">a&gt;0，b&gt;0</span> → <span class="inline-math">a=3，b=2</span></li></ol></div></aside>

        <section class="all-steps" id="stepCards" aria-label="完整解题步骤"></section>
      </div>
