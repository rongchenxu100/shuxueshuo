        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">先整理目标表达式：把 a+b 写成 (a+1)+(b+2)-3，让题设中乘积固定的两个完整正项同时显形，再直接应用基本不等式。</p><ol><li>整理目标表达式：a+b=(a+1)+(b+2)-3。</li><li>找定积：两个正项 a+1、b+2 的乘积为 16。</li><li>验等号：a+1=b+2=4，对应 a=3、b=2，满足正数条件。</li></ol></div></aside>
