        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">逐项引用知识点中的符号法则与不等式性质，并用反例检验是否对所有允许取值成立。</p><ol><li>实数的符号法则：c²≥0，所以 c²+1≥1&gt;0；|c|≥0，但 c=0 时 |c|=0。</li><li>基本性质·可乘性：同乘或同除正数方向不变；同乘 0 后两边相等。</li></ol></div></aside>
