          <div class="problem-full">
            <div class="problem-line"><span>已知 <span class="inline-math">x&gt;0，y&gt;0</span>，且 <span class="inline-math">(x-y)<sup>2</sup>=(xy)<sup>3</sup></span>，求 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">x</span></span>+<span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">y</span></span></span> 的最小值。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">2</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><ol><li>观察结构：目标与条件次数不齐，先配次显出条件量，再代入条件消元，目标平方化为定积求和</li><li>应用基本不等式：识别 <span class="inline-math">xy</span>、<span class="inline-math"><span class="math-fraction"><span class="math-numerator">4</span><span class="math-denominator">xy</span></span></span> 为两个正项，二者乘积恒为 <span class="inline-math">4</span>，得到目标平方不小于 <span class="inline-math">4</span>，从而原目标不小于 <span class="inline-math">2</span></li><li>验证取等：两个正项相等给出 <span class="inline-math">xy=2</span>，再与题设条件联立，得到取等值 <span class="inline-math">(x,y)=(2+<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">2</span></span>，2-<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">2</span></span>)</span> 或 <span class="inline-math">(2-<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">2</span></span>，2+<span class="math-radical"><span class="math-radical-symbol">√</span><span class="math-radicand">2</span></span>)</span></li></ol></div></aside>

  <!-- 第一段：页面数据（var 声明，跨脚本块全局可见） -->
  <script>
    var STEPS      = [{"id":"s1","section":"基本不等式","title":"观察结构","t":0,"showDiagram":false,"visual":{"kind":"basic-inequality-structure-scan","condition":{"label":"条件整式","expression":"\\(x>0，y>0，(x-y)^2=(xy)^3\\)","tag":"含 (x−y)²"},"target":{"label":"目标整式","expression":"\\(\\frac{1}{x}+\\frac{1}{y}\\)","tag":"正数｜暂未显形"},"organization":{"label":"整理目标整式：配次显条件","motive":"目标中的 \\(x+y\\) 为一次，条件中的 \\((x-y)^2\\) 为二次；先平方配次，再用恒等式衔接条件","squareHint":{"source":"目标与条件次数不齐","action":"平方配次","result":"条件量显形","note":"再代入条件消元","ariaLabel":"目标与条件次数不齐时，先平方配次，再代入条件消元"},"steps":[{"label":"平方配次","expression":"\\(\\frac{1}{x}+\\frac{1}{y}>0\\Rightarrow\\left(\\frac{1}{x}+\\frac{1}{y}\\right)^2=\\frac{(x+y)^2}{(xy)^2}\\)"},{"label":"恒等变形","expression":"\\((x+y)^2=(x-y)^2+4xy\\)","marks":{"bracket":"出现条件量 (x−y)²"}},{"label":"代入消元","expression":"\\(\\left(\\frac{1}{x}+\\frac{1}{y}\\right)^2=\\frac{(xy)^3+4xy}{(xy)^2}=xy+\\frac{4}{xy}\\)","marks":{"bracket":"只剩 xy"}}],"note":"消元只剩 \\(xy\\)，目标平方显形"},"pattern":{"first":{"value":"\\(xy\\)","shape":"square"},"second":{"value":"\\(\\frac{4}{xy}\\)","shape":"circle"},"condition":{"operator":"·","tag":"定积 4"},"target":{"operator":"+","tag":"求最小值"},"ariaLabel":"平方并代入条件后，正项 xy 与 4 除以 xy 的积固定，求和的最小值"},"reading":"定积求和","route":"先求目标平方的最小值，再还原目标"},"reasoning":[{"kind":"because","text":"\\(x>0，y>0\\)，所以 \\(\\frac{1}{x}+\\frac{1}{y}>0\\)；目标与条件次数不齐，可以先平方配次"},{"kind":"therefore","text":"\\(\\left(\\frac{1}{x}+\\frac{1}{y}\\right)^2=\\frac{(x+y)^2}{(xy)^2}=\\frac{(x-y)^2+4xy}{(xy)^2}\\)"},{"kind":"because","text":"题设给出 \\((x-y)^2=(xy)^3\\)"},{"kind":"therefore","text":"代入消元得 \\(\\left(\\frac{1}{x}+\\frac{1}{y}\\right)^2=xy+\\frac{4}{xy}\\)"},{"kind":"because","text":"\\(xy\\cdot\\frac{4}{xy}=4\\)"},{"kind":"therefore","text":"整理后是「定积求和」，直接应用基本不等式"}],"derive":[["结构判断","配次显条件｜定积求和"]]},{"id":"s2","section":"基本不等式","title":"应用基本不等式","t":0,"showDiagram":false,"visual":{"kind":"basic-inequality-mapping","methodTag":"直接应用｜定积求和","templateLabel":"代入基本不等式","template":"\\(u+v\\ge2\\sqrt{uv}\\)","formulaStyle":"sum-geometric","showPositiveStep":true,"mappings":[{"slot":"第一个正项","shape":"square","value":"\\(xy\\)","condition":"\\(xy>0\\)"},{"slot":"第二个正项","shape":"circle","value":"\\(\\frac{4}{xy}\\)","condition":"\\(\\frac{4}{xy}>0\\)"}],"mappedSum":"\\(xy+\\frac{4}{xy}\\)","mappedProduct":"\\(4\\)","mapped":"\\(xy+\\frac{4}{xy}\\ge2\\sqrt4\\)","stageLabel":"代入定积","fixedSourceLabel":"已证","fixedSourceTarget":"product","fixedCondition":"\\(xy\\cdot\\frac{4}{xy}=4\\)","replacementText":"把乘积换成 4","replaced":"\\(xy+\\frac{4}{xy}\\ge4\\)","simplifyLabel":"对应目标平方","substituted":"\\(\\left(\\frac{1}{x}+\\frac{1}{y}\\right)^2\\ge4\\)","conclusionLabel":"目标为正，开平方","conclusion":"\\(\\frac{1}{x}+\\frac{1}{y}\\ge2\\)"},"reasoning":[{"kind":"because","text":"\\(xy>0，\\frac{4}{xy}>0\\)"},{"kind":"therefore","text":"\\(xy+\\frac{4}{xy}\\ge2\\sqrt{xy\\cdot\\frac{4}{xy}}\\)"},{"kind":"because","text":"\\(xy\\cdot\\frac{4}{xy}=4\\)"},{"kind":"therefore","text":"\\(xy+\\frac{4}{xy}\\ge4\\)"},{"kind":"therefore","text":"\\(\\left(\\frac{1}{x}+\\frac{1}{y}\\right)^2\\ge4\\)，又 \\(\\frac{1}{x}+\\frac{1}{y}>0\\)，所以 \\(\\frac{1}{x}+\\frac{1}{y}\\ge2\\)"}],"derive":[["下界","2"]]},{"id":"s3","section":"基本不等式","title":"验证取等","t":0,"showDiagram":false,"visual":{"kind":"basic-inequality-equality-check","templateLabel":"基本不等式取等","first":{"value":"\\(xy\\)","shape":"square"},"second":{"value":"\\(\\frac{4}{xy}\\)","shape":"circle"},"conditionLabel":"结合题设条件","condition":"\\(x>0，y>0，(x-y)^2=(xy)^3\\)","solved":"\\((x,y)=(2+\\sqrt2，2-\\sqrt2)\\) 或 \\((2-\\sqrt2，2+\\sqrt2)\\)","verificationLabel":"代回目标","verification":"\\(\\frac{1}{x}+\\frac{1}{y}=\\frac{x+y}{xy}=2\\)","conclusion":"\\(\\frac{1}{x}+\\frac{1}{y}\\) 的最小值为 \\(2\\)"},"reasoning":[{"kind":"because","text":"基本不等式取等 ⇔ 两个正项相等"},{"kind":"therefore","text":"\\(xy=\\frac{4}{xy}\\)"},{"kind":"because","text":"\\(xy>0\\)"},{"kind":"therefore","text":"\\(xy=2\\)"},{"kind":"because","text":"\\((x-y)^2=(xy)^3=8\\)，且 \\((x+y)^2=(x-y)^2+4xy=16\\)"},{"kind":"therefore","text":"\\(x+y=4\\)，解得 \\((x,y)=(2+\\sqrt2，2-\\sqrt2)\\) 或 \\((2-\\sqrt2，2+\\sqrt2)\\)"},{"kind":"therefore","text":"此时原目标等于 \\(2\\)，可以取等号"}],"derive":[["最小值","2"],["等号条件","(x,y)=(2+√2,2−√2) 或 (2−√2,2+√2)"]]}];
    var STEP_LABELS = {"s1":"1 观察结构","s2":"2 应用基本不等式","s3":"3 验证取等"};
    var POLICIES   = {"s1":{"movable":false,"range":[0,0]},"s2":{"movable":false,"range":[0,0]},"s3":{"movable":false,"range":[0,0]}};
