            <div class="problem-line"><span><span class="problem-source-inline">（2021 天津高考）</span>3. 若 <span class="inline-math">a&gt;0，b&gt;0</span>，则 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">a</span></span>+<span class="math-fraction"><span class="math-numerator">a</span><span class="math-denominator">b<sup>2</sup></span></span>+b</span> 的最小值为　　　　。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">2√2</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">三个正项的乘积并不固定；先把前两项配对消去 a，再把所得的 2/b 与 b 配对。两次等号必须能同时成立。</p><ol><li>第一层：1/a 与 a/b² 的乘积为 1/b²，先得到 2/b。</li><li>第二层：2/b 与 b 的乘积恒为 2，再次使用基本不等式。</li><li>等号联立：a=b 且 b=√2。</li></ol></div></aside>

  <script>
    var STEPS      = [{"id":"s1","section":"多次应用基本不等式","title":"判断两次配对并联立等号","t":0,"showDiagram":false,"visual":{"kind":"repeated-basic-inequality-flow","title":"判断两次配对，再逐轮求界","methodTag":"多次应用基本不等式","count":{"variables":["\\(a\\)","\\(b\\)"],"conditions":[],"estimatedRounds":2,"note":"a、b 是两个正变量，题目没有提供等式关系；每次配对通常补一条取等关系，所以预计应用 2 次。"},"rounds":[{"question":"先配哪两个正项，才能让式子变简单？","current":"\\(\\frac{1}{a}+\\frac{a}{b^2}+b\\)","terms":["\\(\\frac{1}{a}\\)","\\(\\frac{a}{b^2}\\)"],"reason":"两项相乘后 a 消失，可以把二元三项式压成只含 b 的两项式。","relation":"\\(\\frac{1}{a}\\cdot\\frac{a}{b^2}=\\frac{1}{b^2}\\)","inequality":"\\(\\frac{1}{a}+\\frac{a}{b^2}\\ge\\frac{2}{b}\\)","result":"\\(\\frac{1}{a}+\\frac{a}{b^2}+b\\ge\\frac{2}{b}+b\\)","insight":"变量 a 已消去，剩下两个乘积固定的正项。","equality":"\\(\\frac{1}{a}=\\frac{a}{b^2}\\Rightarrow a=b\\)"},{"question":"新式中的两个正项能否直接配对？","current":"\\(\\frac{2}{b}+b\\)","terms":["\\(\\frac{2}{b}\\)","\\(b\\)"],"reason":"两个正项的乘积恒为 2，可以直接得到常数下界。","relation":"\\(\\frac{2}{b}\\cdot b=2\\)","inequality":"\\(\\frac{2}{b}+b\\ge2\\sqrt{2}\\)","result":"\\(\\frac{1}{a}+\\frac{a}{b^2}+b\\ge2\\sqrt{2}\\)","insight":"第二次配对已经得到常数下界，接下来只需检查两次等号能否同时成立。","equality":"\\(\\frac{2}{b}=b\\Rightarrow b=\\sqrt{2}\\)"}],"equality":{"label":"求解等号成立条件","conditions":[{"label":"第 1 次取等","expression":"\\(a=b\\)"},{"label":"第 2 次取等","expression":"\\(b=\\sqrt{2}\\)"}],"solved":"\\(a=b=\\sqrt{2}\\)","verification":"\\(a>0，b>0\\)，且代入原式等于 \\(2\\sqrt{2}\\)"},"conclusion":"\\(\\frac{1}{a}+\\frac{a}{b^2}+b\\) 的最小值为 \\(2\\sqrt{2}\\)","caption":"判断轮数只负责规划；真正求解时，每一轮都要完成选项配对、得到新式并记录取等条件，最后统一联立。"},"reasoning":[{"kind":"because","text":"\\(a>0，b>0\\)，所以 \\(\\frac{1}{a}>0，\\frac{a}{b^2}>0\\)"},{"kind":"therefore","text":"\\(\\frac{1}{a}+\\frac{a}{b^2}\\ge 2\\sqrt{\\frac{1}{a}\\cdot\\frac{a}{b^2}}=\\frac{2}{b}\\)"},{"kind":"therefore","text":"\\(\\frac{1}{a}+\\frac{a}{b^2}+b\\ge\\frac{2}{b}+b\\ge2\\sqrt{\\frac{2}{b}\\cdot b}=2\\sqrt{2}\\)"},{"kind":"because","text":"两次取等分别要求 \\(\\frac{1}{a}=\\frac{a}{b^2}\\) 与 \\(\\frac{2}{b}=b\\)"},{"kind":"therefore","text":"\\(a=b，b=\\sqrt{2}\\Rightarrow a=b=\\sqrt{2}\\)，故最小值为 \\(2\\sqrt{2}\\)"}],"derive":[["最小值","2√2"],["等号条件","a=b=√2"]]}];
