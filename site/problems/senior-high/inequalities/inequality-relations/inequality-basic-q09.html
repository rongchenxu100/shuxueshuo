            <div class="problem-line"><span><span class="problem-source-inline">（2019 天津高考（文科））</span>5. 设 <span class="inline-math">x&gt;0，y&gt;0，x+2y=4</span>，则 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">(x+1)(2y+1)</span><span class="math-denominator">xy</span></span></span> 的最小值为　　　　。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">9/2</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><ol><li>观察结构：分子是乘积，展开后出现条件量 <span class="inline-math">x+2y</span>，代入消元后只剩 <span class="inline-math">xy</span>，原式化为 <span class="inline-math">2+<span class="math-fraction"><span class="math-numerator">5</span><span class="math-denominator">xy</span></span></span></li><li>应用基本不等式：识别 <span class="inline-math">x</span>、<span class="inline-math">2y</span> 为两个正项，二者和固定为 <span class="inline-math">4</span>，得到 <span class="inline-math">xy≤2</span>，进而得到原式不小于 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">9</span><span class="math-denominator">2</span></span></span></li><li>验证取等：两个正项相等且满足 <span class="inline-math">x+2y=4</span> → <span class="inline-math">x=2，y=1</span></li></ol></div></aside>

xy\\)","mapped":"\\(x+2y\\ge2\\sqrt{2xy}\\)","stageLabel":"代入定和","fixedSourceLabel":"已知","fixedCondition":"\\(x+2y=4\\)","replacementText":"把定和换成 4","replaced":"\\(4\\ge2\\sqrt{2xy}\\)","simplifyLabel":"平方并化简","substituted":"\\(xy\\le2\\)","conclusionLabel":"正数取倒数，方向反转","conclusion":"\\(2+\\frac{5}{xy}\\ge2+\\frac{5}{2}=\\frac{9}{2}\\)"},"reasoning":[{"kind":"because","text":"\\(x>0，2y>0\\)"},{"kind":"therefore","text":"\\(x+2y\\ge2\\sqrt{x\\cdot2y}=2\\sqrt{2xy}\\)"},{"kind":"because","text":"\\(x+2y=4\\)"},{"kind":"therefore","text":"\\(4\\ge2\\sqrt{2xy}\\Rightarrow xy\\le2\\)"},{"kind":"therefore","text":"因 \\(xy>0\\)，\\(2+\\frac{5}{xy}\\ge2+\\frac{5}{2}=\\frac{9}{2}\\)"}],"derive":[["下界","9/2"]]},{"id":"s3","section":"基本不等式","title":"验证取等","t":0,"showDiagram":false,"visual":{"kind":"basic-inequality-equality-check","templateLabel":"基本不等式取等","first":{"value":"\\(x\\)","shape":"square"},"second":{"value":"\\(2y\\)","shape":"circle"},"conditionLabel":"结合定和条件","condition":"\\(x+2y=4\\)","solved":"\\(x=2，y=1\\)","verificationLabel":"代回目标","verification":"\\(\\frac{(x+1)(2y+1)}{xy}=\\frac{9}{2}\\)","conclusion":"原式的最小值为 \\(\\frac{9}{2}\\)"},"reasoning":[{"kind":"because","text":"基本不等式取等 ⇔ 两个正项相等"},{"kind":"therefore","text":"\\(x=2y\\)"},{"kind":"because","text":"\\(x+2y=4\\)"},{"kind":"therefore","text":"\\(x=2，y=1\\)"},{"kind":"therefore","text":"此时 \\(xy=2\\)，原式等于 \\(\\frac{9}{2}\\)，可以取等号"}],"derive":[["最小值","9/2"],["等号条件","x=2，y=1"]]}];
