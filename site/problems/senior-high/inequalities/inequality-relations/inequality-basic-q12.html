            <div class="problem-line"><span><span class="problem-source-inline">（2020 江苏高考）</span>已知 <span class="inline-math">5x<sup>2</sup>y<sup>2</sup>+y<sup>4</sup>=1</span>（<span class="inline-math">x，y∈<span class="math-blackboard">ℝ</span></span>），则 <span class="inline-math">x<sup>2</sup>+y<sup>2</sup></span> 的最小值是　　　　。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">4/5</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">条件和目标只含平方，先令 u=x²、v=y²。由条件消去 u 后，目标化为两个乘积固定的正项之和。</p><ol><li>令 u=x²≥0，v=y²；原条件迫使 0&lt;v≤1。</li><li>由 5uv+v²=1 得 u+v=1/(5v)+4v/5。</li><li>等号 v=1/2 时 u=3/10，满足原条件。</li></ol></div></aside>
