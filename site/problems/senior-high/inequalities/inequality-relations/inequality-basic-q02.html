            <div class="problem-line"><span>2. 已知正实数 <span class="inline-math">x，y</span> 满足 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">x</span></span>+<span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">y</span></span>=1</span>，则 <span class="inline-math">xy</span> 最小值为　　　　。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">4</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><ol><li>观察结构：1/x、1/y 是两个正项，其和为定值 1；求 xy 的最小值，可先求 1/(xy) 的最大值。</li><li>应用基本不等式：识别 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">x</span></span></span>、<span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">y</span></span></span> 为两个正项，代入基本不等式公式与定和，得到 <span class="inline-math">xy≥4</span>。</li><li>验证取等：两个正项相等且满足定和 → x=y=2。</li></ol></div></aside>
