        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">引用核心知识：先看 a 的符号确定抛物线开口，再看 Δ 与实根确定图像和 x 轴的位置关系。</p><ol><li>令 y=-x²+2x-3；a&lt;0，所以抛物线开口向下。</li><li>Δ&lt;0，图像与 x 轴没有交点；结合开口方向可知整个图像在 x 轴下方。</li><li>题目要求 y&gt;0，因此解集为空集。</li></ol></div></aside>
