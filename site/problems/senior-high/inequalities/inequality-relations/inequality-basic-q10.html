            <div class="problem-line"><span><span class="problem-source-inline">（2018 天津高考（理科））</span>6. 已知 <span class="inline-math">a，b∈<span class="math-blackboard">ℝ</span></span>，且 <span class="inline-math">a-3b+6=0</span>，则 <span class="inline-math">2<sup>a</sup>+<span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">8<sup>b</sup></span></span></span> 的最小值为　　　　。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">1/4</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><ol><li>观察结构：由 <span class="inline-math">8=2<sup>3</sup></span> 把 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">8<sup>b</sup></span></span></span> 化为 <span class="inline-math">2<sup>-3b</sup></span>，统一底数后两项乘积的指数出现条件量 <span class="inline-math">a-3b</span></li><li>应用基本不等式：识别 <span class="inline-math">2<sup>a</sup></span>、<span class="inline-math">2<sup>-3b</sup></span> 为两个正项，代入基本不等式公式与定积，得到原式不小于 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">1</span><span class="math-denominator">4</span></span></span></li><li>验证取等：两个正项相等，并与 <span class="inline-math">a-3b=-6</span> 联立 → <span class="inline-math">a=-3，b=1</span></li></ol></div></aside>
