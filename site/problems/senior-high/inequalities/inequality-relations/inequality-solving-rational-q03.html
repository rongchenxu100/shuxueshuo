            <div class="problem-line"><span>解不等式 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">2x<sup>2</sup>-x-2</span><span class="math-denominator">x<sup>2</sup>+x+1</span></span>&gt;1</span>。</span><span class="answer-chip" id="answerI">答案：<span class="inline-math">(-∞,-1)∪(3,+∞)</span></span></div>
          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">主方法仍是分式穿针；本题先用二次函数图像证明分母恒正，再只判断分子的符号。</p><ol><li>移项通分得 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">(x-3)(x+1)</span><span class="math-denominator">x<sup>2</sup>+x+1</span></span>&gt;0</span>。</li><li>对分母 <span class="inline-math">y=x<sup>2</sup>+x+1</span>，有 <span class="inline-math">a&gt;0、Δ=-3&lt;0</span>，抛物线恒在 x 轴上方，所以分母恒正且没有禁值点。</li><li>分式符号因此只由分子决定；在 −1、3 两个分子零点处穿针，读取正号外侧。</li></ol></div></aside>
