        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">引用绝对值不等式知识点：右侧 2x 的符号不确定，不能直接平方，应先按 2x 的正负分类。</p><ol><li>x&lt;0 时，|x²−3|≥0&gt;2x，不等式自动成立。</li><li>x≥0 时右侧非负，才能使用 |A|&gt;B ⇔ A&gt;B 或 A&lt;−B。</li><li>分别解两个二次不等式，再把各分类所得解集取并集。</li></ol></div></aside>
