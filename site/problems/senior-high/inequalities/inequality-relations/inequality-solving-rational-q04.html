          </div>
        </section>

        <aside class="lesson-key-points" aria-label="解题要点"><div class="lesson-key-points-title">解题要点</div><div class="lesson-key-points-content"><p class="lesson-key-points-lead">引用分式不等式知识点：先移项通分并化成正首项乘积，再把分母禁值点与分子零点共同穿针。</p><ol><li>移项通分得 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">4-5x</span><span class="math-denominator">3x-2</span></span>&gt;0</span>，不能直接乘符号未知的 <span class="inline-math">3x-2</span>。</li><li>转化为正首项标准式 <span class="inline-math">(5x-4)(3x-2)&lt;0</span>，同时保留 <span class="inline-math">x≠<span class="math-fraction"><span class="math-numerator">2</span><span class="math-denominator">3</span></span></span>。</li><li>先比较 <span class="inline-math"><span class="math-fraction"><span class="math-numerator">2</span><span class="math-denominator">3</span></span>&lt;<span class="math-fraction"><span class="math-numerator">4</span><span class="math-denominator">5</span></span></span>：左端是分母禁值点，右端是分子零点；严格不等式两点均不取。</li></ol></div></aside>

        <section class="all-steps" id="stepCards" aria-label="完整解题步骤"></section>
