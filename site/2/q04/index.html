      <p data-math-text>当 $1\le x\le2$ 时，不等式 $x^2+mx+4&lt;0$ 恒成立，求实数 $m$ 的取值范围。</p>

          <div class="meaning-row"><dt>条件</dt><dd data-math-text>$\forall x\in[1,2],$ $x^2+mx+4&lt;0$</dd></div>
          <div class="meaning-row"><dt>目标</dt><dd data-math-text>$\{m\in\mathbb R\mid\text{上述条件成立}\}$</dd></div>
        </dl>
      </section>

<script type="application/json" id="practice-config">
{
  "id": "quadratic-always-q04",
  "version": 1,
  "variables": [
    "x",
    "m"
  ],
  "method_question": "这道题，你准备采用哪种解题方法？",
  "methods": [
    {
      "id": "interval",
      "label": "区间最值法"
    },
    {
      "id": "extremum",
      "label": "分离参数法"
    }
  ],
  "routes": {
    "interval": [
      {
        "id": "i_basis",
        "title": "判断适用条件",
        "question": "区间最值法需要一个前提。看看本题是否满足？",
        "interaction": {
          "type": "checklist",
          "title": "区间最值法的前提",
          "slots": [
            {
              "label": "$x$ 的取值范围",
              "hint": "看题目要求对哪些 $x$ 成立",
              "options": [
                {
                  "value": "all_real",
                  "label": "全体实数",
                  "note": "在全体实数上，看整条图像与横轴的位置。"
                },
                {
                  "value": "interval",
                  "label": "某个区间",
                  "note": "只看区间上的那一段图像，比较区间上的最值。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "interval"
          ]
        },
        "feedback": {
          "terms": "题目只要求 $1\\le x\\le2$ 时成立，$x$ 的取值范围是区间 $[1,2]$。"
        },
        "submit_label": "确认判断",
        "display": "i_basis-done",
        "board": "interval-board"
      },
      {
        "id": "i_condition",
        "title": "转化为最值条件",
        "question": "要使 $f(x)<0$ 对所有 $x\\in[1,2]$ 成立，$f(x)$ 应满足哪个条件？",
        "interaction": {
          "type": "choice",
          "field": "i_condition",
          "options": [
            {
              "value": "max",
              "label": "$x\\in[1,2]$ 时，$f(x)_{\\max}<0$"
            },
            {
              "value": "min",
              "label": "$x\\in[1,2]$ 时，$f(x)_{\\min}<0$"
            },
            {
              "value": "one_point",
              "label": "$f(2)<0$"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "max"
          ]
        },
        "feedback": {
          "answer": "恒成立要求区间上每一点都满足：最高点在横轴下方，整段才在下方。只比最低点或一个点，别处仍可能不满足。"
        },
        "submit_label": "确认判断",
        "display": "i_condition-done"
      },
      {
        "id": "i_extremum",
        "title": "分类讨论最值",
        "question": "$x^2$ 的系数为 $1$，$f(x)$ 开口向上，对称轴为 $x=-\\frac m2$。拖动对称轴观察图像，逐项确定 $f(x)$ 在 $[1,2]$ 上的最大值。",
        "interaction": {
          "type": "checklist",
          "title": "按对称轴的位置分类",
          "slots": [
            {
              "label": "对称轴和谁比较",
              "hint": "开口向上时，离对称轴越远，函数值越大",
              "options": [
                {
                  "value": "midpoint",
                  "label": "区间中点 $x=\\frac32$",
                  "note": "对称轴在中点哪一侧，决定哪个端点离它更远。"
                },
                {
                  "value": "endpoints",
                  "label": "端点 $x=1$ 和 $x=2$",
                  "note": "对称轴在区间左侧、内部还是右侧，决定最低点在哪里。"
                }
              ]
            },
            {
              "label": "对称轴在中点左侧或中点上（$m\\ge-3$）时，最大值为",
              "hint": "哪个端点离对称轴更远？",
              "options": [
                {
                  "value": "f1",
                  "label": "$f(1)$",
                  "note": "左端点最高。"
                },
                {
                  "value": "f2",
                  "label": "$f(2)$",
                  "note": "右端点最高。"
                },
                {
                  "value": "vertex",
                  "label": "顶点处的值",
                  "note": "顶点最高。"
                }
              ]
            },
            {
              "label": "对称轴在中点右侧（$m<-3$）时，最大值为",
              "hint": "哪个端点离对称轴更远？",
              "options": [
                {
                  "value": "f1",
                  "label": "$f(1)$",
                  "note": "左端点最高。"
                },
                {
                  "value": "f2",
                  "label": "$f(2)$",
                  "note": "右端点最高。"
                },
                {
                  "value": "vertex",
                  "label": "顶点处的值",
                  "note": "顶点最高。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "midpoint",
            "f2",
            "f1"
          ]
        },
        "feedback": {
          "terms": "开口向上时，离对称轴越远的端点越高，所以对称轴和区间中点 $\\frac32$ 比较。对称轴在中点左侧或中点上时，右端点 $x=2$ 更远，最大值为 $f(2)$；在中点右侧时，左端点 $x=1$ 更远，最大值为 $f(1)$。顶点是最低点。"
        },
        "submit_label": "确认判断",
        "display": "i_extremum-done",
        "board": "i_extremum-board"
      },
      {
        "id": "i_range",
        "title": "求参数范围",
        "question": "两种情况下，都要求区间上的最大值小于 $0$。$m$ 的取值范围是什么？",
        "interaction": {
          "type": "choice",
          "field": "i_range",
          "options": [
            {
              "value": "union",
              "label": "$m<-5$"
            },
            {
              "value": "loose",
              "label": "$m<-4$"
            },
            {
              "value": "empty",
              "label": "无解"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "union"
          ]
        },
        "feedback": {
          "answer": "每种情况内部，解出的范围要与这种情况的前提取交集；两种情况是“或”的关系，合并时取并集。"
        },
        "submit_label": "确认判断",
        "display": "i_range-done",
        "board": "i_range-board"
      },
      {
        "id": "i_boundary",
        "title": "检查边界",
        "question": "上一步的范围以 $m=-5$ 为边界。代回原不等式，它要保留吗？",
        "interaction": {
          "type": "checklist",
          "title": "逐个检查边界",
          "slots": [
            {
              "label": "$m=-5$",
              "hint": "此时原不等式变为 $x^2-5x+4<0$",
              "options": [
                {
                  "value": "holds",
                  "label": "对所有 $x$ 成立，保留",
                  "note": "最终范围包含 $m=-5$。"
                },
                {
                  "value": "fails",
                  "label": "有 $x$ 不成立，排除",
                  "note": "最终范围不含 $m=-5$。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "fails"
          ]
        },
        "feedback": {
          "terms": "$m=-5$ 时原不等式为 $x^2-5x+4<0$。代入 $x=1$ 得 $1-5+4=0$，不满足 $<0$。"
        },
        "submit_label": "确认检查",
        "display": "i_boundary-done",
        "board": "boundary-board"
      }
    ],
    "extremum": [
      {
        "id": "e_basis",
        "title": "判断适用条件",
        "question": "分离参数法需要两个前提。逐项看看，本题是否满足？",
        "interaction": {
          "type": "checklist",
          "title": "分离参数法的两个前提",
          "slots": [
            {
              "label": "参数能否单独放到一边",
              "hint": "看含参数的项能否移到不等号的一边",
              "options": [
                {
                  "value": "separated",
                  "label": "已经分离",
                  "note": "参数和 $x$ 已在不等号两边，可以直接比较。"
                },
                {
                  "value": "movable",
                  "label": "移项后可以分离",
                  "note": "把含参数的项移到一边，必要时再除以它的系数。"
                },
                {
                  "value": "tangled",
                  "label": "无法分离",
                  "note": "参数和 $x$ 拆不开时，分离参数法用不上。"
                }
              ]
            },
            {
              "label": "是否要除以含 $x$ 的式子",
              "hint": "除以负数时，不等号要变向",
              "options": [
                {
                  "value": "no_division",
                  "label": "不需要除",
                  "note": "不涉及除法，不等号方向不变。"
                },
                {
                  "value": "fixed_sign",
                  "label": "需要除，符号确定",
                  "note": "符号确定，就能确定不等号是否变向。"
                },
                {
                  "value": "unknown_sign",
                  "label": "需要除，符号不定",
                  "note": "符号不定时要分类讨论，不能直接除。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "movable",
            "fixed_sign"
          ]
        },
        "feedback": {
          "terms": "含 $m$ 的只有 $mx$ 一项，移项后要除以 $x$；而 $x\\in[1,2]$，$x>0$，符号确定。"
        },
        "submit_label": "确认判断",
        "display": "e_basis-done",
        "board": "separation-board"
      },
      {
        "id": "e_separate",
        "title": "分离参数",
        "question": "移项得 $mx<-x^2-4$。两边同除以 $x$，得到哪个不等式？",
        "interaction": {
          "type": "choice",
          "field": "e_separate",
          "options": [
            {
              "value": "keep",
              "label": "$m<-\\left(x+\\frac4x\\right)$"
            },
            {
              "value": "flip",
              "label": "$m>-\\left(x+\\frac4x\\right)$"
            },
            {
              "value": "partial",
              "label": "$m<-(x+4)$"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "keep"
          ]
        },
        "feedback": {
          "answer": "$x>0$，两边除以正数，不等号方向不变；右边每一项都要除以 $x$。"
        },
        "submit_label": "确认判断",
        "display": "e_separate-done",
        "board": "e_separate-board"
      },
      {
        "id": "e_condition",
        "title": "转化为最值条件",
        "question": "要使 $m<-h(x)$ 对所有 $x\\in[1,2]$ 成立，$m$ 应满足哪个条件？",
        "interaction": {
          "type": "choice",
          "field": "e_condition",
          "options": [
            {
              "value": "max",
              "label": "$x\\in[1,2]$ 时，$m<-h(x)_{\\max}$"
            },
            {
              "value": "min",
              "label": "$x\\in[1,2]$ 时，$m<-h(x)_{\\min}$"
            },
            {
              "value": "one_point",
              "label": "$m<-h(2)$"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "max"
          ]
        },
        "feedback": {
          "answer": "$m<-h(x)$ 即 $h(x)<-m$：区间上整段图像都要在 $y=-m$ 下方，只需比 $h(x)$ 的最高点。加负号后，最大变最小。"
        },
        "submit_label": "确认判断",
        "display": "e_condition-done"
      },
      {
        "id": "e_graph",
        "title": "画函数图像",
        "question": "$h(x)=x+\\frac4x$（$x>0$）是对勾函数。逐项确定它的图像特征。",
        "interaction": {
          "type": "checklist",
          "title": "对勾函数的图像特征",
          "slots": [
            {
              "label": "最低点",
              "hint": "用基本不等式求 $x+\\frac4x$ 的最小值",
              "options": [
                {
                  "value": "low_2",
                  "label": "$(2,4)$",
                  "note": "图像在 $x=2$ 处最低。"
                },
                {
                  "value": "low_4",
                  "label": "$(4,5)$",
                  "note": "图像在 $x=4$ 处最低。"
                },
                {
                  "value": "low_1",
                  "label": "$(1,5)$",
                  "note": "图像在 $x=1$ 处最低。"
                }
              ]
            },
            {
              "label": "$x\\to0^+$ 时",
              "hint": "$x$ 越来越小，$\\frac4x$ 怎样变化？",
              "options": [
                {
                  "value": "y_axis",
                  "label": "贴近 $y$ 轴向上",
                  "note": "图像左端沿 $y$ 轴越升越高。"
                },
                {
                  "value": "x_axis",
                  "label": "贴近 $x$ 轴",
                  "note": "图像左端越来越平，贴着 $x$ 轴。"
                },
                {
                  "value": "origin",
                  "label": "趋近原点",
                  "note": "图像左端落到原点附近。"
                }
              ]
            },
            {
              "label": "$x\\to+\\infty$ 时",
              "hint": "$x$ 越来越大，$\\frac4x$ 怎样变化？",
              "options": [
                {
                  "value": "line",
                  "label": "贴近直线 $y=x$",
                  "note": "图像右端沿直线 $y=x$ 斜向上。"
                },
                {
                  "value": "flat",
                  "label": "贴近直线 $y=4$",
                  "note": "图像右端越来越平。"
                },
                {
                  "value": "fall",
                  "label": "贴近 $x$ 轴",
                  "note": "图像右端回落到 $x$ 轴附近。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "low_2",
            "y_axis",
            "line"
          ]
        },
        "feedback": {
          "terms": "$x+\\frac4x\\ge2\\sqrt{x\\cdot\\frac4x}=4$，$x=\\frac4x$ 即 $x=2$ 时取等，最低点 $(2,4)$。$x\\to0^+$ 时 $\\frac4x$ 越来越大，图像贴近 $y$ 轴向上；$x\\to+\\infty$ 时 $\\frac4x\\to0$，$h(x)$ 越来越接近 $x$，图像贴近直线 $y=x$。"
        },
        "submit_label": "确认判断",
        "display": "e_graph-done",
        "board": "e_graph-board"
      },
      {
        "id": "e_extremum",
        "title": "求最值",
        "question": "$h(x)$ 在 $[1,2]$ 上的最大值在哪里取到？",
        "interaction": {
          "type": "checklist",
          "title": "区间与最低点的位置",
          "slots": [
            {
              "label": "$[1,2]$ 在最低点 $x=2$ 的",
              "hint": "对照上一步的图像",
              "options": [
                {
                  "value": "left",
                  "label": "左侧",
                  "note": "这一段图像一直下降。"
                },
                {
                  "value": "right",
                  "label": "右侧",
                  "note": "这一段图像一直上升。"
                },
                {
                  "value": "around",
                  "label": "两侧都有",
                  "note": "这一段图像先降后升。"
                }
              ]
            },
            {
              "label": "最大值",
              "hint": "看这一段图像哪一端更高",
              "options": [
                {
                  "value": "at_left",
                  "label": "$h(1)=5$",
                  "note": "最大值在左端点取到。"
                },
                {
                  "value": "at_right",
                  "label": "$h(2)=4$",
                  "note": "最大值在右端点取到。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "left",
            "at_left"
          ]
        },
        "feedback": {
          "terms": "$[1,2]\\subseteq(0,2]$，在最低点左侧，这一段图像一直下降，最高点在左端：$h(1)=5$。$h(2)=4$ 是最小值。"
        },
        "submit_label": "确认判断",
        "display": "e_extremum-done",
        "board": "e_extremum-board"
      },
      {
        "id": "e_boundary",
        "title": "检查边界",
        "question": "上一步的范围以 $m=-5$ 为边界。代回原不等式，它要保留吗？",
        "interaction": {
          "type": "checklist",
          "title": "逐个检查边界",
          "slots": [
            {
              "label": "$m=-5$",
              "hint": "此时原不等式变为 $x^2-5x+4<0$",
              "options": [
                {
                  "value": "holds",
                  "label": "对所有 $x$ 成立，保留",
                  "note": "最终范围包含 $m=-5$。"
                },
                {
                  "value": "fails",
                  "label": "有 $x$ 不成立，排除",
                  "note": "最终范围不含 $m=-5$。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "fails"
          ]
        },
        "feedback": {
          "terms": "$m=-5$ 时原不等式为 $x^2-5x+4<0$。代入 $x=1$ 得 $1-5+4=0$，不满足 $<0$。"
        },
        "submit_label": "确认检查",
        "display": "e_boundary-done",
        "board": "boundary-board"
      }
    ]
  },
  "completion": "lesson-completion"
}
