        "interaction": {
          "type": "choice",
          "field": "v_rewrite",

            {
              "value": "collect",
              "label": "$f(m)=(x^2-x+1)m-6$"

          ]
        },
        "expected_answer": {
          "one_of": [
            "collect"
          ]
        },
        "feedback": {
          "answer": "含 $m$ 的项有 $mx^2$、$-mx$、$m$ 三项，提出 $m$ 得 $(x^2-x+1)m$；$-6$ 不含 $m$，是常数项，不能并进 $m$ 的系数。"

        "submit_label": "确认判断",
        "display": "v_rewrite-done",
        "board": "v_rewrite-board"
      },
      {
        "id": "v_condition",

        "interaction": {
          "type": "choice",
          "field": "v_condition",
          "options": [
            {
              "value": "max",
              "label": "$m\\in[1,3]$ 时，$f(m)_{\\max}<0$"

        "expected_answer": {
          "one_of": [
            "max"

        },
        "submit_label": "确认判断",
        "display": "v_condition-done"
      },
      {
        "id": "v_extremum",
        "title": "求最值",

        "interaction": {
          "type": "checklist",
          "title": "看斜率判断最值",
          "slots": [
            {
              "label": "斜率 $x^2-x+1$ 的符号",
              "hint": "把 $x^2-x+1$ 配方",
              "options": [
                {
                  "value": "positive",
                  "label": "恒为正",
                  "note": "$f(m)$ 在 $[1,3]$ 上递增。"
                },
                {
                  "value": "unknown",
                  "label": "随 $x$ 变化，符号不定",
                  "note": "递增、递减、不变都可能出现。"
                },
                {
                  "value": "negative",
                  "label": "恒为负",
                  "note": "$f(m)$ 在 $[1,3]$ 上递减。"
                }
              ]
            },
            {
              "label": "$f(m)$ 在 $[1,3]$ 上的最大值",
              "hint": "一次函数的最值在端点处取到",
              "options": [
                {
                  "value": "left",
                  "label": "$f(1)=x^2-x-5$",
                  "note": "在左端点 $m=1$ 处取到。"
                },

                  "value": "right",
                  "label": "$f(3)=3x^2-3x-3$",
                  "note": "在右端点 $m=3$ 处取到。"
                },
                {
                  "value": "ends",
                  "label": "$f(1)$、$f(3)$ 中较大的一个",
                  "note": "两端都小于 $0$，最大值才小于 $0$。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "positive",
            "right"
          ]
        },
        "feedback": {
          "terms": "$x^2-x+1=\\left(x-\\frac12\\right)^2+\\frac34>0$，斜率恒为正，$f(m)$ 在 $[1,3]$ 上递增，最大值在右端点：$f(3)=3(x^2-x+1)-6=3x^2-3x-3$。"
        },
        "submit_label": "确认判断",
        "display": "v_extremum-done",
        "board": "v_extremum-board"
      },
      {
        "id": "v_range",
        "title": "解关于 x 的不等式",
        "question": "由 $f(3)=3x^2-3x-3<0$，即 $x^2-x-1<0$，$x$ 在什么范围内？",

            },
            {
              "value": "closed",
              "label": "$\\frac{1-\\sqrt5}2\\le x\\le\\frac{1+\\sqrt5}2$"
            }
          ]
        },

        },
        "submit_label": "确认判断",
        "display": "v_range-done",
        "board": "range-board"
      },

                  "value": "fails",
                  "label": "有 $m$ 不成立，排除",
                  "note": "最终范围不含这个边界。"
                }
              ]
            },
            {
              "label": "$x=\\frac{1+\\sqrt5}2$",
              "hint": "此时 $x^2-x=1$，原不等式变为 $2m-6<0$",
              "options": [

                  "value": "holds",
                  "label": "对所有 $m$ 成立，保留",
                  "note": "最终范围包含这个边界。"
                },
                {
                  "value": "fails",
                  "label": "有 $m$ 不成立，排除",
                  "note": "最终范围不含这个边界。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "fails",
            "fails"
          ]
        },
        "feedback": {
          "terms": "两个边界处都有 $x^2-x=1$，原不等式变为 $2m-6<0$；取 $m=3$，左边 $=0$，不满足 $<0$，两个都排除。"
        },
        "submit_label": "确认检查",
        "display": "v_boundary-done",
        "board": "boundary-board"
      }
    ]
  },
  "completion": "lesson-completion"
