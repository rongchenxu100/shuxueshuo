<script type="application/json" id="practice-config">
{
  "id": "quadratic-always-q09",
  "version": 1,
  "variables": [
    "a",
    "x"
  ],
  "method_question": "这道题，你准备采用哪种解题方法？",
  "methods": [
    {
      "id": "variable",
      "label": "更换主元法"
    }
  ],
  "routes": {
    "variable": [
      {
        "id": "v_basis",
        "title": "判断适用条件",
        "question": "更换主元法需要两个前提。逐项看看，本题是否满足？",
        "interaction": {
          "type": "checklist",
          "title": "更换主元法的两个前提",
          "slots": [
            {
              "label": "题目要求对哪个变量的所有取值都成立",
              "hint": "区分恒成立针对的变量与待求取值范围的变量",
              "options": [
                {
                  "value": "given",
                  "label": "$a$：对任意 $a\\in[-1,1]$",
                  "note": "把 $a$ 当作自变量，$x$ 当作常数。"
                },
                {
                  "value": "asked",
                  "label": "$x$：对任意实数 $x$",
                  "note": "把 $x$ 当作自变量，$a$ 当作常数。"
                }
              ]
            },
            {
              "label": "固定另一个字母后，表达式关于所选主元是几次式",
              "hint": "只数所选主元的次数，另一个字母按常数处理",
              "options": [
                {
                  "value": "linear",
                  "label": "一次形式，可退化为常数",
                  "note": "一次项系数为零时是常数；两种情况下，最值都在闭区间的端点取到。"
                },
                {
                  "value": "quadratic",
                  "label": "二次式",
                  "note": "还要看开口和对称轴。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "given",
            "linear"
          ]
        },
        "feedback": {
          "terms": "恒成立针对任意 $a\\in[-1,1]$，并非任意实数 $x$；$x$ 是待求取值范围的变量。固定 $x$ 后，$y=(x^2-x)a-x+1$ 关于 $a$ 是一次形式；$x=0$ 或 $1$ 时退化为常数。"
        },
        "submit_label": "确认判断",
        "display": "v_basis-done",
        "board": "variable-board"
      },
      {
        "id": "v_rewrite",
        "title": "更换主元",
        "question": "把 $x$ 当作常数、$a$ 当作自变量，$y$ 可以整理成哪个函数？",
        "interaction": {
          "type": "choice",
          "field": "v_rewrite",
          "options": [
            {
              "value": "collect",
              "label": "$f(a)=(x^2-x)a-x+1$"
            },
            {
              "value": "sign",
              "label": "$f(a)=(x^2-x)a+x+1$"
            },
            {
              "value": "merged",
              "label": "$f(a)=(x^2-2x)a+1$"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "collect"
          ]
        },
        "feedback": {
          "answer": "先去括号：$-(a+1)x=-ax-x$。含 $a$ 的项有 $ax^2$、$-ax$，提出 $a$ 得 $(x^2-x)a$；$-x$ 和 $1$ 不含 $a$，是常数项，不能并进 $a$ 的系数。"
        },
        "submit_label": "确认判断",
        "display": "v_rewrite-done",
        "board": "v_rewrite-board"
      },
      {
        "id": "v_condition",
        "title": "转化为最值条件",
        "question": "要使 $f(a)>0$ 对所有 $a\\in[-1,1]$ 成立，$f(a)$ 应满足哪个条件？",
        "interaction": {
          "type": "choice",
          "field": "v_condition",
          "options": [
            {
              "value": "max",
              "label": "$a\\in[-1,1]$ 时，$f(a)_{\\max}>0$"
            },
            {
              "value": "min",
              "label": "$a\\in[-1,1]$ 时，$f(a)_{\\min}>0$"
            },
            {
              "value": "one_point",
              "label": "$f(0)>0$"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "min"
          ]
        },
        "feedback": {
          "answer": "要 $[-1,1]$ 上所有的 $a$ 都使 $f(a)>0$，只需最小值大于 $0$；最大值大于 $0$ 只能保证一处；只看 $a=0$，别的 $a$ 仍可能不满足。"
        },
        "submit_label": "确认判断",
        "display": "v_condition-done"
      },
      {
        "id": "v_extremum",
        "title": "求最值",
        "question": "$f(a)=(x^2-x)a-x+1$ 的斜率为 $x^2-x$，可能为 $0$。$f(a)$ 在 $[-1,1]$ 上的最小值在哪里取到？",
        "interaction": {
          "type": "checklist",
          "title": "看斜率判断最值",
          "slots": [
            {
              "label": "斜率 $x^2-x$ 的符号",
              "hint": "$x^2-x=x(x-1)$，$x$ 取不同的值试试",
              "options": [
                {
                  "value": "positive",
                  "label": "恒为正",
                  "note": "$f(a)$ 在 $[-1,1]$ 上递增。"
                },
                {
                  "value": "unknown",
                  "label": "随 $x$ 变化，符号不定",
                  "note": "递增、递减、不变都可能出现。"
                },
                {
                  "value": "negative",
                  "label": "恒为负",
                  "note": "$f(a)$ 在 $[-1,1]$ 上递减。"
                }
              ]
            },
            {
              "label": "$f(a)$ 在 $[-1,1]$ 上的最小值",
              "hint": "图像是线段；斜率为零时，所有点的函数值相同",
              "options": [
                {
                  "value": "left",
                  "label": "$f(-1)=1-x^2$",
                  "note": "在左端点 $a=-1$ 处取到。"
                },
                {
                  "value": "right",
                  "label": "$f(1)=(x-1)^2$",
                  "note": "在右端点 $a=1$ 处取到。"
                },
                {
                  "value": "ends",
                  "label": "$f(-1)$、$f(1)$ 中较小的一个",
                  "note": "两端都大于 $0$，最小值才大于 $0$。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "unknown",
            "ends"
          ]
        },
        "feedback": {
          "terms": "$x^2-x=x(x-1)$：$x<0$ 或 $x>1$ 时为正，$0<x<1$ 时为负，$x=0$ 或 $1$ 时为 $0$。斜率符号不定，最低点可能在任一端，最小值是 $f(-1)$、$f(1)$ 中较小的一个，所以两端都要大于 $0$。"
        },
        "submit_label": "确认判断",
        "display": "v_extremum-done",
        "board": "v_extremum-board"
      },
      {
        "id": "v_range",
        "title": "解关于 x 的不等式",
        "question": "由 $f(-1)=1-x^2>0$ 且 $f(1)=(x-1)^2>0$，$x$ 在什么范围内？",
        "interaction": {
          "type": "choice",
          "field": "v_range",
          "options": [
            {
              "value": "intersect",
              "label": "$-1<x<1$"
            },
            {
              "value": "only_right",
              "label": "$x\\ne1$"
            },
            {
              "value": "closed",
              "label": "$-1\\le x\\le1$"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "intersect"
          ]
        },
        "feedback": {
          "answer": "$1-x^2>0$ 得 $-1<x<1$；$(x-1)^2>0$ 得 $x\\ne1$。两个条件要同时成立，取交集；端点处 $1-x^2=0$，不满足 $>0$。"
        },
        "submit_label": "确认判断",
        "display": "v_range-done",
        "board": "range-board"
      },
      {
        "id": "v_boundary",
        "title": "检查边界",
        "question": "上一步的范围以 $x=-1$、$x=1$ 为边界。逐个代回原不等式，它们要保留吗？",
        "interaction": {
          "type": "checklist",
          "title": "逐个检查边界",
          "slots": [
            {
              "label": "$x=-1$",
              "hint": "此时原不等式变为 $2a+2>0$",
              "options": [
                {
                  "value": "holds",
                  "label": "对所有 $a$ 成立，保留",
                  "note": "最终范围包含这个边界。"
                },
                {
                  "value": "fails",
                  "label": "有 $a$ 不成立，排除",
                  "note": "最终范围不含这个边界。"
                }
              ]
            },
            {
              "label": "$x=1$",
              "hint": "此时原不等式变为 $0>0$",
              "options": [
                {
                  "value": "holds",
                  "label": "对所有 $a$ 成立，保留",
                  "note": "最终范围包含这个边界。"
                },
                {
                  "value": "fails",
                  "label": "有 $a$ 不成立，排除",
                  "note": "最终范围不含这个边界。"
                }
              ]
            }
          ]
        },
        "expected_answer": {
          "terms": [
            "fails",
            "fails"
          ]
        },
        "feedback": {
          "terms": "$x=-1$ 时原不等式为 $2a+2>0$，取 $a=-1$，左边 $=0$，不成立；$x=1$ 时 $y=0$，对所有 $a$ 都不满足 $>0$。两个都排除。"
        },
        "submit_label": "确认检查",
        "display": "v_boundary-done",
        "board": "boundary-board"
      }
    ]
  },
  "completion": "lesson-completion"
}
