<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Arial Unicode MS",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#247f76" stroke-opacity=".04" stroke-width="1"/></pattern></defs>
<rect width="1080" height="1440" fill="#fffdf7"/><rect width="1080" height="1440" fill="url(#grid)"/>
<text xml:space="preserve" x="72" y="92" font-size="26" fill="#087e77" font-weight="600" text-anchor="start">数学说  /  高一第一周错题复盘</text>
<text xml:space="preserve" x="1008" y="92" font-size="26" fill="#5b6b70" font-weight="400" text-anchor="end">02 / 09</text>
<text xml:space="preserve" x="72" y="164" font-size="48" fill="#123d43" font-weight="700" text-anchor="start">检查二次项系数</text>
<text xml:space="preserve" x="72" y="222" font-size="48" fill="#123d43" font-weight="700" text-anchor="start">是否为0</text>
<text xml:space="preserve" x="72" y="269" font-size="25" fill="#5b6b70" font-weight="400" text-anchor="start">特训一 · 第9题</text>
<path d="M72 1340 L1008 1340" fill="none" stroke="#d7e1d9" stroke-width="2"/>
<text xml:space="preserve" x="72" y="1384" font-size="24" fill="#5b6b70" font-weight="400" text-anchor="start">每类一道代表题 · 集合与常用逻辑用语</text>
<text xml:space="preserve" x="1008" y="1384" font-size="26" fill="#087e77" font-weight="700" text-anchor="end">数学说</text>
<rect x="72" y="290" width="936" height="152" rx="24" fill="#fffdf7" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="96" y="337" font-size="34" fill="#123d43" font-weight="400" text-anchor="start">集合 A={x｜kx²+4x+4=0} 中有2个元素，</text>
<text xml:space="preserve" x="96" y="391" font-size="34" fill="#123d43" font-weight="400" text-anchor="start">求实数 k 的取值范围。</text>
<rect x="72" y="466" width="936" height="60" rx="16" fill="#fbefea" stroke="#efd5cb" stroke-width="2"/>
<text xml:space="preserve" x="96" y="506" font-size="29" fill="#c54f44" font-weight="400" text-anchor="start">原解：Δ=16−16k&gt;0 → k&lt;1</text>
<text xml:space="preserve" x="540" y="584" font-size="38" fill="#123d43" font-weight="700" text-anchor="middle">用判别式前，先检查 k</text>
<path d="M540 604 L540 639" fill="none" stroke="#087e77" stroke-width="4"/>
<polygon points="540.00,639.00 533.07,625.70 546.93,625.70" fill="#087e77"/>
<path d="M306 640 L774 640" fill="none" stroke="#087e77" stroke-width="4"/>
<path d="M306 640 L306 672" fill="none" stroke="#087e77" stroke-width="4"/>
<polygon points="306.00,672.00 299.07,658.70 312.93,658.70" fill="#087e77"/>
<path d="M774 640 L774 672" fill="none" stroke="#087e77" stroke-width="4"/>
<polygon points="774.00,672.00 767.07,658.70 780.93,658.70" fill="#087e77"/>
<rect x="72" y="690" width="458" height="298" rx="24" fill="#fbefea" stroke="#dddcd2" stroke-width="2"/>
<text xml:space="preserve" x="100" y="750" font-size="46" fill="#c54f44" font-weight="700" text-anchor="start">k=0</text>
<text xml:space="preserve" x="100" y="815" font-size="32" fill="#123d43" font-weight="400" text-anchor="start">4x+4=0</text>
<text xml:space="preserve" x="100" y="874" font-size="32" fill="#123d43" font-weight="400" text-anchor="start">x=−1，只有1个根</text>
<text xml:space="preserve" x="100" y="933" font-size="32" fill="#123d43" font-weight="400" text-anchor="start">不满足“2个元素”</text>
<rect x="550" y="690" width="458" height="298" rx="24" fill="#e9f3ef" stroke="#dddcd2" stroke-width="2"/>
<text xml:space="preserve" x="578" y="750" font-size="46" fill="#087e77" font-weight="700" text-anchor="start">k≠0</text>
<text xml:space="preserve" x="578" y="815" font-size="32" fill="#123d43" font-weight="400" text-anchor="start">仍是一元二次方程</text>
<text xml:space="preserve" x="578" y="874" font-size="32" fill="#123d43" font-weight="400" text-anchor="start">Δ=16−16k&gt;0</text>
<text xml:space="preserve" x="578" y="933" font-size="32" fill="#123d43" font-weight="400" text-anchor="start">得到 k&lt;1</text>
<rect x="72" y="1056" width="936" height="78" rx="18" fill="#123d43" stroke="#123d43" stroke-width="2"/>
<text xml:space="preserve" x="96" y="1105" font-size="26" fill="#9ed5c5" font-weight="600" text-anchor="start">正确结论</text>
<text xml:space="preserve" x="976" y="1107" font-size="38" fill="#fffdf7" font-weight="700" text-anchor="end">k∈(−∞,0)∪(0,1)</text>
<rect x="72" y="1192" width="936" height="116" rx="20" fill="#e9f3ef" stroke="#c9ddd3" stroke-width="2"/>
<text xml:space="preserve" x="96" y="1230" font-size="25" fill="#087e77" font-weight="700" text-anchor="start">带走这个方法</text>
<text xml:space="preserve" x="96" y="1272" font-size="30" fill="#123d43" font-weight="600" text-anchor="start">系数为0时，先按剩余方程讨论。</text>
</svg>