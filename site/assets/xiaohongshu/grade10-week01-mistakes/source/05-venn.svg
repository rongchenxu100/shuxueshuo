<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Arial Unicode MS",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#247f76" stroke-opacity=".04" stroke-width="1"/></pattern></defs>
<rect width="1080" height="1440" fill="#fffdf7"/><rect width="1080" height="1440" fill="url(#grid)"/>
<text xml:space="preserve" x="72" y="92" font-size="26" fill="#087e77" font-weight="600" text-anchor="start">数学说  /  高一第一周错题复盘</text>
<text xml:space="preserve" x="1008" y="92" font-size="26" fill="#5b6b70" font-weight="400" text-anchor="end">05 / 09</text>
<text xml:space="preserve" x="72" y="164" font-size="48" fill="#123d43" font-weight="700" text-anchor="start">集合关系要画维恩图</text>
<text xml:space="preserve" x="72" y="269" font-size="25" fill="#5b6b70" font-weight="400" text-anchor="start">特训四 · 第7题（多选）</text>
<path d="M72 1340 L1008 1340" fill="none" stroke="#d7e1d9" stroke-width="2"/>
<text xml:space="preserve" x="72" y="1384" font-size="24" fill="#5b6b70" font-weight="400" text-anchor="start">每类一道代表题 · 集合与常用逻辑用语</text>
<text xml:space="preserve" x="1008" y="1384" font-size="26" fill="#087e77" font-weight="700" text-anchor="end">数学说</text>
<rect x="72" y="290" width="936" height="254" rx="24" fill="#fffdf7" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="96" y="333" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">当 U 为全集，下列说法中正确的是：</text>
<text xml:space="preserve" x="96" y="378" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">A. A∩B=∅ ⇒ (∁<tspan baseline-shift="sub" font-size="70%">U</tspan>A)∪(∁<tspan baseline-shift="sub" font-size="70%">U</tspan>B)=U</text>
<text xml:space="preserve" x="96" y="423" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">B. A∩B=∅ ⇒ A=∅ 或 B=∅</text>
<text xml:space="preserve" x="96" y="468" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">C. A∪B=U ⇒ (∁<tspan baseline-shift="sub" font-size="70%">U</tspan>A)∩(∁<tspan baseline-shift="sub" font-size="70%">U</tspan>B)=∅</text>
<text xml:space="preserve" x="96" y="513" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">D. A∪B=∅ ⇒ A=B=∅</text>
<rect x="72" y="564" width="936" height="60" rx="16" fill="#fbefea" stroke="#efd5cb" stroke-width="2"/>
<text xml:space="preserve" x="96" y="604" font-size="29" fill="#c54f44" font-weight="400" text-anchor="start">原答案：AD。漏掉了 C 项。</text>
<text xml:space="preserve" x="72" y="674" font-size="32" fill="#087e77" font-weight="700" text-anchor="start">看 C：A∪B=U，全集就是两圆的并集</text>
<rect x="72" y="702" width="300" height="268" rx="24" fill="#fffdf7" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="222" y="747" font-size="27" fill="#123d43" font-weight="600" text-anchor="middle">① 取 A 的补集</text>
<defs><mask id="exclude-0"><rect x="72" y="760" width="300" height="180" fill="white"/><circle cx="191" cy="844" r="68" fill="black"/></mask></defs>
<circle cx="191" cy="844" r="68" fill="#e9f3ef"/>
<circle cx="255" cy="844" r="68" fill="#e9f3ef"/>
<circle cx="255" cy="844" r="68" fill="#68b9a5" mask="url(#exclude-0)"/>
<circle cx="191" cy="844" r="68" fill="none" stroke="#087e77" stroke-width="3"/>
<circle cx="255" cy="844" r="68" fill="none" stroke="#087e77" stroke-width="3"/>
<text xml:space="preserve" x="170" y="853" font-size="29" fill="#123d43" font-weight="600" text-anchor="middle">A</text>
<text xml:space="preserve" x="276" y="853" font-size="29" fill="#123d43" font-weight="600" text-anchor="middle">B</text>
<text xml:space="preserve" x="222" y="944" font-size="27" fill="#087e77" font-weight="600" text-anchor="middle">B 中、A 外</text>
<rect x="390" y="702" width="300" height="268" rx="24" fill="#fffdf7" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="540" y="747" font-size="27" fill="#123d43" font-weight="600" text-anchor="middle">② 取 B 的补集</text>
<defs><mask id="exclude-1"><rect x="390" y="760" width="300" height="180" fill="white"/><circle cx="573" cy="844" r="68" fill="black"/></mask></defs>
<circle cx="509" cy="844" r="68" fill="#e9f3ef"/>
<circle cx="573" cy="844" r="68" fill="#e9f3ef"/>
<circle cx="509" cy="844" r="68" fill="#68b9a5" mask="url(#exclude-1)"/>
<circle cx="509" cy="844" r="68" fill="none" stroke="#087e77" stroke-width="3"/>
<circle cx="573" cy="844" r="68" fill="none" stroke="#087e77" stroke-width="3"/>
<text xml:space="preserve" x="488" y="853" font-size="29" fill="#123d43" font-weight="600" text-anchor="middle">A</text>
<text xml:space="preserve" x="594" y="853" font-size="29" fill="#123d43" font-weight="600" text-anchor="middle">B</text>
<text xml:space="preserve" x="540" y="944" font-size="27" fill="#087e77" font-weight="600" text-anchor="middle">A 中、B 外</text>
<rect x="708" y="702" width="300" height="268" rx="24" fill="#fffdf7" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="858" y="747" font-size="27" fill="#123d43" font-weight="600" text-anchor="middle">③ 取二者交集</text>
<defs><mask id="exclude-2"><rect x="708" y="760" width="300" height="180" fill="white"/><circle cx="891" cy="844" r="68" fill="black"/></mask></defs>
<circle cx="827" cy="844" r="68" fill="#e9f3ef"/>
<circle cx="891" cy="844" r="68" fill="#e9f3ef"/>
<circle cx="827" cy="844" r="68" fill="none" stroke="#087e77" stroke-width="3"/>
<circle cx="891" cy="844" r="68" fill="none" stroke="#087e77" stroke-width="3"/>
<text xml:space="preserve" x="806" y="853" font-size="29" fill="#123d43" font-weight="600" text-anchor="middle">A</text>
<text xml:space="preserve" x="912" y="853" font-size="29" fill="#123d43" font-weight="600" text-anchor="middle">B</text>
<text xml:space="preserve" x="858" y="944" font-size="27" fill="#087e77" font-weight="600" text-anchor="middle">无公共元素：∅</text>
<text xml:space="preserve" x="96" y="1015" font-size="28" fill="#123d43" font-weight="400" text-anchor="start">A项：无重叠，每个元素至少在一个补集中。</text>
<text xml:space="preserve" x="96" y="1057" font-size="28" fill="#123d43" font-weight="400" text-anchor="start">B项反例：A={1}，B={2}，两者均非空。</text>
<text xml:space="preserve" x="96" y="1099" font-size="28" fill="#123d43" font-weight="400" text-anchor="start">D项：并集为空，两个集合都只能为空。</text>
<rect x="72" y="1144" width="936" height="78" rx="18" fill="#123d43" stroke="#123d43" stroke-width="2"/>
<text xml:space="preserve" x="96" y="1193" font-size="26" fill="#9ed5c5" font-weight="600" text-anchor="start">正确结论</text>
<text xml:space="preserve" x="976" y="1195" font-size="38" fill="#fffdf7" font-weight="700" text-anchor="end">ACD</text>
<text xml:space="preserve" x="96" y="1280" font-size="33" fill="#087e77" font-weight="700" text-anchor="start">先分别标区域，再做交、并、补运算。</text>
</svg>