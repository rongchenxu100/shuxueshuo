<text xml:space="preserve" x="72" y="92" font-size="26" fill="#087e77" font-weight="600" text-anchor="start">数学说  /  高一第一周错题复盘</text>
<text xml:space="preserve" x="1008" y="92" font-size="26" fill="#5b6b70" font-weight="400" text-anchor="end">09 / 09</text>
<text xml:space="preserve" x="72" y="164" font-size="48" fill="#123d43" font-weight="700" text-anchor="start">先理解条件的含义，再明确</text>
<text xml:space="preserve" x="72" y="222" font-size="48" fill="#123d43" font-weight="700" text-anchor="start">题目要求的推导方向</text>
<text xml:space="preserve" x="72" y="269" font-size="25" fill="#5b6b70" font-weight="400" text-anchor="start">特训五 · 第11题 · 最后一题自己判断</text>
<path d="M72 1340 L1008 1340" fill="none" stroke="#d7e1d9" stroke-width="2"/>
<text xml:space="preserve" x="72" y="1384" font-size="24" fill="#5b6b70" font-weight="400" text-anchor="start">每类一道代表题 · 集合与常用逻辑用语</text>
<text xml:space="preserve" x="1008" y="1384" font-size="26" fill="#087e77" font-weight="700" text-anchor="end">数学说</text>
<rect x="72" y="290" width="936" height="207" rx="24" fill="#fffdf7" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="96" y="335" font-size="32" fill="#123d43" font-weight="400" text-anchor="start">若 −1≤x&lt;2，则“x²−a≤0”为真命题的</text>
<text xml:space="preserve" x="96" y="383" font-size="32" fill="#123d43" font-weight="400" text-anchor="start">一个充分条件可以是：</text>
<text xml:space="preserve" x="96" y="463" font-size="31" fill="#123d43" font-weight="400" text-anchor="start">A. a≥3     B. a&gt;4     C. a≥1     D. a&gt;1</text>
<rect x="72" y="518" width="936" height="60" rx="16" fill="#fbefea" stroke="#efd5cb" stroke-width="2"/>
<text xml:space="preserve" x="96" y="558" font-size="29" fill="#c54f44" font-weight="400" text-anchor="start">原答案：C。读清两层含义，再重新选择。</text>
<rect x="72" y="610" width="454" height="161" rx="24" fill="#e9f3ef" stroke="#ccdcd5" stroke-width="2"/>
<rect x="550" y="610" width="458" height="161" rx="24" fill="#fbefea" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="98" y="657" font-size="32" fill="#087e77" font-weight="700" text-anchor="start">“一个充分条件”</text>
<text xml:space="preserve" x="98" y="710" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">所选条件一成立，</text>
<text xml:space="preserve" x="98" y="751" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">原命题就一定成立。</text>
<text xml:space="preserve" x="576" y="657" font-size="32" fill="#c54f44" font-weight="700" text-anchor="start">“命题为真”</text>
<text xml:space="preserve" x="576" y="710" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">范围内每一个 x，</text>
<text xml:space="preserve" x="576" y="751" font-size="29" fill="#123d43" font-weight="400" text-anchor="start">都要满足 x²≤a。</text>
<path d="M301 786 L540 824" fill="none" stroke="#087e77" stroke-width="4"/>
