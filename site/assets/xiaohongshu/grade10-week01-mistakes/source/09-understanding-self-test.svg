<polygon points="540.00,824.00 552.05,815.07 554.23,828.75" fill="#087e77"/>
<text xml:space="preserve" x="540" y="883" font-size="34" fill="#123d43" font-weight="700" text-anchor="middle">真正要保证：a 能盖住所有这些 x²</text>
