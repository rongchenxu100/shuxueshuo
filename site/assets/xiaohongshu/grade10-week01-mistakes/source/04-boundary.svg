<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Arial Unicode MS",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#247f76" stroke-opacity=".04" stroke-width="1"/></pattern></defs>
<rect width="1080" height="1440" fill="#fffdf7"/><rect width="1080" height="1440" fill="url(#grid)"/>
<text xml:space="preserve" x="72" y="92" font-size="26" fill="#087e77" font-weight="600" text-anchor="start">数学说  /  高一第一周错题复盘</text>
<text xml:space="preserve" x="1008" y="92" font-size="26" fill="#5b6b70" font-weight="400" text-anchor="end">04 / 09</text>
<text xml:space="preserve" x="72" y="164" font-size="48" fill="#123d43" font-weight="700" text-anchor="start">边界值一定要代入</text>
<text xml:space="preserve" x="72" y="222" font-size="48" fill="#123d43" font-weight="700" text-anchor="start">原集合验证关系</text>
<text xml:space="preserve" x="72" y="269" font-size="25" fill="#5b6b70" font-weight="400" text-anchor="start">特训三 · 第14题第2问</text>
<path d="M72 1340 L1008 1340" fill="none" stroke="#d7e1d9" stroke-width="2"/>
<text xml:space="preserve" x="72" y="1384" font-size="24" fill="#5b6b70" font-weight="400" text-anchor="start">每类一道代表题 · 集合与常用逻辑用语</text>
<text xml:space="preserve" x="1008" y="1384" font-size="26" fill="#087e77" font-weight="700" text-anchor="end">数学说</text>
<rect x="72" y="290" width="936" height="156" rx="24" fill="#fffdf7" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="96" y="336" font-size="33" fill="#123d43" font-weight="400" text-anchor="start">A=[−3,4]，B={x｜2m−1&lt;x&lt;m+1}。</text>
<text xml:space="preserve" x="96" y="390" font-size="33" fill="#123d43" font-weight="400" text-anchor="start">若 A∪B=A，求 m 的取值范围。</text>
<rect x="72" y="468" width="936" height="102" rx="16" fill="#fbefea" stroke="#efd5cb" stroke-width="2"/>
<text xml:space="preserve" x="96" y="508" font-size="29" fill="#c54f44" font-weight="400" text-anchor="start">原解已分空集／非空集，得到 m&gt;−1。</text>
<text xml:space="preserve" x="96" y="550" font-size="29" fill="#c54f44" font-weight="400" text-anchor="start">问题在于：边界 m=−1 能不能取？</text>
<rect x="72" y="594" width="936" height="344" rx="24" fill="#e9f3ef" stroke="#ccdcd5" stroke-width="2"/>
<text xml:space="preserve" x="96" y="648" font-size="40" fill="#087e77" font-weight="700" text-anchor="start">代入 m=−1</text>
<path d="M202 721 L906 721" fill="none" stroke="#b6c4c2" stroke-width="2"/>
<text xml:space="preserve" x="174" y="731" font-size="29" fill="#123d43" font-weight="600" text-anchor="end">A</text>
<path d="M280.22222222222223 721 L827.7777777777777 721" fill="none" stroke="#087e77" stroke-width="7"/>
<circle cx="280.22222222222223" cy="721" r="8" fill="#087e77" stroke="#087e77" stroke-width="3"/>
<circle cx="827.7777777777777" cy="721" r="8" fill="#087e77" stroke="#087e77" stroke-width="3"/>
<text xml:space="preserve" x="280.22222222222223" y="766" font-size="26" fill="#5b6b70" font-weight="400" text-anchor="middle">−3</text>
<text xml:space="preserve" x="827.7777777777777" y="766" font-size="26" fill="#5b6b70" font-weight="400" text-anchor="middle">4</text>
<path d="M202 824 L906 824" fill="none" stroke="#b6c4c2" stroke-width="2"/>
<text xml:space="preserve" x="174" y="834" font-size="29" fill="#123d43" font-weight="600" text-anchor="end">B</text>
<path d="M280.22222222222223 824 L514.8888888888889 824" fill="none" stroke="#087e77" stroke-width="7"/>
<circle cx="280.22222222222223" cy="824" r="8" fill="#fffdf7" stroke="#087e77" stroke-width="3"/>
<circle cx="514.8888888888889" cy="824" r="8" fill="#fffdf7" stroke="#087e77" stroke-width="3"/>
<text xml:space="preserve" x="280.22222222222223" y="869" font-size="26" fill="#5b6b70" font-weight="400" text-anchor="middle">−3</text>
<text xml:space="preserve" x="514.8888888888889" y="869" font-size="26" fill="#5b6b70" font-weight="400" text-anchor="middle">0</text>
<text xml:space="preserve" x="96" y="914" font-size="31" fill="#123d43" font-weight="600" text-anchor="start">B=(−3,0) 中的每个数仍在 A 内。</text>
<text xml:space="preserve" x="96" y="992" font-size="31" fill="#123d43" font-weight="400" text-anchor="start">B=∅：m≥2；B≠∅：−1≤m&lt;2。</text>
<rect x="72" y="1056" width="936" height="78" rx="18" fill="#123d43" stroke="#123d43" stroke-width="2"/>
<text xml:space="preserve" x="96" y="1105" font-size="26" fill="#9ed5c5" font-weight="600" text-anchor="start">正确结论</text>
<text xml:space="preserve" x="976" y="1107" font-size="38" fill="#fffdf7" font-weight="700" text-anchor="end">m≥−1</text>
<rect x="72" y="1192" width="936" height="116" rx="20" fill="#e9f3ef" stroke="#c9ddd3" stroke-width="2"/>
<text xml:space="preserve" x="96" y="1230" font-size="25" fill="#087e77" font-weight="700" text-anchor="start">带走这个方法</text>
<text xml:space="preserve" x="96" y="1272" font-size="30" fill="#123d43" font-weight="600" text-anchor="start">开端点，也可能允许参数取等。</text>
</svg>