<text xml:space="preserve" x="96" y="337" font-size="31" fill="#123d43" font-weight="400" text-anchor="start">A={x｜y=x²−4}，B={y｜y=x²−4}，</text>
<text xml:space="preserve" x="96" y="385" font-size="31" fill="#123d43" font-weight="400" text-anchor="start">C={(x,y)｜y=x²−4}。正确关系是：</text>
<text xml:space="preserve" x="96" y="447" font-size="30" fill="#123d43" font-weight="400" text-anchor="start">A. A=B      B. B⊆A</text>
<text xml:space="preserve" x="96" y="496" font-size="30" fill="#123d43" font-weight="400" text-anchor="start">C. A⊆C     D. 2∈C</text>
