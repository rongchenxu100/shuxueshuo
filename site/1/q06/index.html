  <script src="/assets/practice/math-text.js?v=10" defer></script>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="数学说首页"><span class="brand-mark" aria-hidden="true">数</span>数学说</a>
      <span class="demo-label">基本不等式</span>
      <button type="button" class="reset-button" id="reset">↺ <span>重新练习</span></button>
    </div>
  </header>

  <main class="workspace">
    <div class="eyebrow"><span><a class="chapter-return" href="/1/">← 返回题库</a> <span class="separator">/</span> Q06</span></div>
    <section class="problem-card" aria-labelledby="problem-title">
      <h1 id="problem-title">原题</h1>
      <p data-math-text>已知实数 $x>1$，则 $2x+\frac2{x-1}$ 的最小值为？</p>
      <section class="meaning-panel" aria-labelledby="meaning-title">
        <div class="meaning-heading"><h2 id="meaning-title">题意整理</h2><span>根据原题转写</span></div>
        <dl class="problem-meaning" aria-label="题意的数学表达">
          <div class="meaning-row"><dt>条件</dt><dd><span data-math-text>$x>1$</span></dd></div>
          <div class="meaning-row"><dt>目标</dt><dd><span data-math-text>$\left(2x+\frac2{x-1}\right)_{\min}$</span></dd></div>
        </dl>
      </section>
    </section>
    <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
    <section id="attempt-history" aria-label="之前的路径尝试"></section>
    <section id="steps" aria-label="逐步解题"></section>
    <div id="completion" hidden></div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <div class="composer-heading"><span class="focus-dot" aria-hidden="true"></span><span id="conversation-focus">正在讨论：凑配表达式</span></div>
      <div class="input-shell">
        <textarea id="message" rows="1" placeholder="也可以在这里说说你的思路…" aria-label="你的思路"></textarea>
        <button class="send-button" type="button" disabled aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-5 14-2-6-7-1Zm7 1 7-8"/></svg></button>
      </div>
      <div class="network-feedback"><span id="network-status" role="status" aria-live="polite"></span><button id="request-retry" type="button" hidden>重试</button></div>
    </div>
  </footer>
  <div id="picker" class="token-picker" role="dialog" aria-label="选择数学项" hidden>
    <span class="picker-label">选择数学项</span>
    <div class="picker-options"></div>
  </div>
  <div id="announcement" class="sr-only" aria-live="polite" role="status"></div>

  <script type="application/json" id="practice-config">
{
  "id": "q06",
  "version": 2,
  "variables": [
    "x"
  ],
  "method_question": "这道题，你准备采用哪种解题方案？",
  "methods": [
    {
      "id": "matching",
      "label": "配凑后应用基本不等式"
    }
  ],
  "routes": {
    "matching": [
      {
        "id": "rewrite",
        "title": "凑配表达式",
        "question": "怎样改写原式，让其中两个正项的积固定？",
        "interaction": {
          "type": "choice",
          "field": "rewrite_form",
          "options": [
            {
              "value": "fixed_product",
              "label": "$2(x-1)+\\frac2{x-1}+2$"
            },
            {
              "value": "missing_constant",
              "label": "$2(x-1)+\\frac2{x-1}$"
            },
            {
              "value": "wrong_constant",
              "label": "$2(x-1)+\\frac2{x-1}-2$"
            }
          ],
          "description": "fixed_product为先配成2(x-1)再加回2；missing_constant遗漏补回的2；wrong_constant将补回的2写成减2。"
        },
        "expected_answer": {
          "one_of": [
            "fixed_product"
          ]
        },
        "feedback": {
          "answer": "先核对 $2x=2(x-1)+2$。改写后需要补回常数 $2$，才能与原式相等。"
        },
        "submit_label": "确认改写",
        "display": "rewrite-done",
        "preview": {
          "fixed_product": "preview-fixed_product",
          "missing_constant": "preview-missing_constant",
          "wrong_constant": "preview-wrong_constant"
        }
      },
      {
        "id": "structure",
        "title": "观察结构",
        "question": "这两项是定和求积，还是定积求和？",
        "interaction": {
          "type": "structure",
          "terms": [
            "2(x-1)",
            "2/(x-1)"
          ],
          "term_labels": {
            "2(x-1)": "$2(x-1)$",
            "2/(x-1)": "$\\frac2{x-1}$"
          }
        },
        "expected_answer": {
          "terms": [
            "2(x-1)",
            "2/(x-1)"
          ],
          "fixed": "product",
          "target": "sum"
        },
        "feedback": {
          "terms": "两项应分别为 $2(x-1)$ 和 $\\frac2{x-1}$，常数 $2$ 留在外面。",
          "structure": "固定的是两项的积：$2(x-1)\\cdot\\frac2{x-1}=4$；要找的是它们和的最小值。"
        },
        "submit_label": "确认结构",
        "display": "structure-done"
      },
      {
        "id": "amgm",
        "title": "应用基本不等式",
        "question": "对这两个正项应用基本不等式，能得到什么关系？",
        "interaction": {
          "type": "amgm",
          "terms": [
            "2(x-1)",
            "2/(x-1)"
          ],
          "term_labels": {
            "2(x-1)": "$2(x-1)$",
            "2/(x-1)": "$\\frac2{x-1}$"
          }
        },
        "expected_answer": {
          "terms": [
            "2(x-1)",
            "2/(x-1)"
          ]
        },
        "feedback": {
          "terms": "两个位置应分别对应 $2(x-1)$ 和 $\\frac2{x-1}$。"
        },
        "submit_label": "确认代入",
        "display": "amgm-done"
      },
      {
        "id": "equality",
        "title": "验证取等",
        "question": "什么条件下，这个下界可以取到？",
        "interaction": {
          "type": "equality",
          "terms": [
            "2(x-1)",
            "2/(x-1)"
          ],
          "term_labels": {
            "2(x-1)": "$2(x-1)$",
            "2/(x-1)": "$\\frac2{x-1}$"
          }
        },
        "expected_answer": {
          "terms": [
            "2(x-1)",
            "2/(x-1)"
          ]
        },
        "feedback": {
          "terms": "取等需要参与基本不等式的两项相等：$2(x-1)=\\frac2{x-1}$。"
        },
        "submit_label": "确认取等",
        "display": "equality-done"
      }
    ]
  },
  "completion": "lesson-completion"
}
  </script>

  <template id="rewrite-done">
    <div class="visual-board completed-visual"><div class="board-caption">凑配：改写原式，保留常数</div>
      <div class="function-conversion">
        <div><span class="conversion-label">原式</span><div class="math" data-math-text>$2x+\frac2{x-1}$</div></div>
        <span class="conversion-arrow" aria-hidden="true">→</span>
        <div><span class="conversion-label">配成两项，再加回常数</span><div class="formula conversion-terms"><span class="shape square expression-slot" data-math-text>$2(x-1)$</span><span>+</span><span class="shape circle expression-slot" data-math-text>$\frac2{x-1}$</span><span>+</span><span data-math-text>$2$</span></div></div>
      </div>
    </div>
    <div class="reasoning"><span class="section-label">核对等价改写</span>
      <p data-math-text>$2x=2(x-1)+2$</p>
    </div>
  </template>
  <template id="preview-fixed_product"><div class="reasoning choice-preview"><span class="section-label">展开核对</span><p data-math-text>$2(x-1)+\frac2{x-1}+2=2x-2+\frac2{x-1}+2=2x+\frac2{x-1}$</p></div></template>
  <template id="preview-missing_constant"><div class="reasoning choice-preview"><span class="section-label">展开核对</span><p data-math-text>$2(x-1)+\frac2{x-1}=2x+\frac2{x-1}-2$</p><p data-math-text>比原式少了 $2$，需要加回来。</p></div></template>
  <template id="preview-wrong_constant"><div class="reasoning choice-preview"><span class="section-label">展开核对</span><p data-math-text>$2(x-1)+\frac2{x-1}-2=2x+\frac2{x-1}-4$</p><p data-math-text>展开后比原式少了 $4$，与原式不等价。</p></div></template>
<template id="structure-done"><div class="visual-board completed-visual"><div class="structure-summary"><div class="summary-item"><span class="summary-label">定积</span><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span> · <span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><span class="flow-arrow" aria-hidden="true">→</span><div class="summary-item"><span class="summary-label">求和</span><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span> + <span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div></div></div><div class="reasoning"><span class="section-label">根据你的选择，整理思路</span><p data-math-text>$x&gt;1\ \Longrightarrow\ 2(x-1)&gt;0,\quad\frac2{x-1}&gt;0$</p><p data-math-text>$2(x-1)\cdot\frac2{x-1}=4$</p><p data-math-text>两个正项的积固定，求和的最小值。常数 $2$ 留在外面，最后加回。</p></div></template>
  <template id="amgm-done">
    <div data-completed-amgm data-first="{{first}}" data-second="{{second}}" data-first-label="{{first_math}}" data-second-label="{{second_math}}"></div>
    <details class="details" id="{{uid}}-derivation" open><summary>完整推导</summary>
      <p data-math-text>$2(x-1)+\frac2{x-1}\ge2\sqrt{2(x-1)\cdot\frac2{x-1}}=4$</p>
      <p data-math-text>$2x+\frac2{x-1}=2(x-1)+\frac2{x-1}+2\ge4+2=6$</p>
    </details><p class="calculation-note">下界已经得到，还需要检查它能否取到。</p>
  </template>
  <template id="equality-done">
    <div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div>
    <div class="reasoning"><span class="section-label">系统计算 · 验证取等</span>
      <p data-math-text>$2(x-1)=\frac2{x-1}\ \Longrightarrow\ (x-1)^2=1$</p>
      <p data-math-text>$x-1>0\ \Longrightarrow\ x-1=1\ \Longrightarrow\ x=2$</p>
      <p data-math-text>$2\cdot2+\frac2{2-1}=6$</p><p data-math-text>$x=2>1$ 满足原条件，下界可以取到。</p>
    </div>
  </template>
  <template id="lesson-completion"><section class="completion-card" tabindex="-1"><h2 data-math-text>$2x+\frac2{x-1}$ 的最小值为 $6$</h2><p data-math-text>当 $x=2$ 时取到。</p></section></template>
</body>
</html>
