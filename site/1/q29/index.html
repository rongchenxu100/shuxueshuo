<div class="visual-board completed-visual"><div class="board-caption">对任意实数成立</div><div class="formula" data-math-text>$p\le\dfrac{s^2}{4}$</div></div><div class="reasoning"><span class="section-label">系统计算 · 代入条件</span><p data-math-text>$(a-b)^2\ge0\ \Longrightarrow\ p\le\frac{s^2}{4}$</p><p data-math-text>${\frac{s^2-1}{3}\le\frac{s^2}{4}}$</p><p data-math-text>${s^2\le4\ \Longrightarrow\ -2\le s\le2}$</p><p data-math-text>目标 ${\frac x2+y=\frac s2}$</p></div>
  </template>
  <template id="range-board">
<div class="visual-board"><div class="board-caption">由 s 的范围换到目标</div><div class="substitution-definitions"><div class="formula" data-math-text>$-2\le s\le2$</div><div class="formula" data-math-text>$\dfrac x2+y=\dfrac s2$</div></div></div>
  </template>
  <template id="preview-range-closed">
<div class="reasoning choice-preview"><span class="section-label">范围核对</span><p data-math-text>$-2\le s\le2$ 各除以 $2$：</p><p data-math-text>${-1\le\frac s2\le1}$</p></div>
  </template>
  <template id="preview-range-forgot_half">
<div class="reasoning choice-preview"><span class="section-label">范围核对</span><p data-math-text>$[-2,2]$ 是 $s=a+b$ 的范围，目标是 $\frac s2$，还要除以 $2$。</p></div>
  </template>
  <template id="preview-range-upper_only">
<div class="reasoning choice-preview"><span class="section-label">范围核对</span><p data-math-text>只写了上界，题目求取值范围，下界也要。</p></div>
  </template>
  <template id="preview-range-positive">
<div class="reasoning choice-preview"><span class="section-label">范围核对</span><p data-math-text>题目没有说 $x,y$ 为正，目标可以是负数。</p><p data-math-text>比如 $x=-1,\ y=-\frac12$ 时，${\frac x2+y=-1}$。</p></div>
  </template>
  <template id="range-done">
<div class="visual-board completed-visual"><div class="board-caption">换回目标</div><div class="formula" data-math-text>$-1\le\dfrac x2+y\le1$</div></div><div class="reasoning"><span class="section-label">系统计算 · 换回目标</span><p data-math-text>${-2\le s\le2\ \Longrightarrow\ -1\le\frac s2\le1}$</p><p data-math-text>还要检查两个端点能否取到。</p></div>
  </template>
  <template id="equality-done">
<div class="visual-board completed-visual"><div class="board-caption">端点取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 端点与中间值</span><p data-math-text>${p=\frac{s^2}{4}\ \Longleftrightarrow\ (a-b)^2=0}$</p><p data-math-text>$a=b$ 即 $x=2y$，代入条件：${x^2=1}$</p><p data-math-text>$x=1,\ y=\frac12$ 时取 $1$</p><p data-math-text>$x=-1,\ y=-\frac12$ 时取 $-1$</p><p data-math-text>对 $[-2,2]$ 内任意 $s$，取 $p=\frac{s^2-1}{3}$，</p><p data-math-text>${s^2-4p=\frac{4-s^2}{3}\ge0}$，</p><p data-math-text>存在实数 $a,b$，即存在 $x=a,\ y=\frac b2$，中间值也都能取到。</p></div>
  </template>
  <template id="lesson-completion">
<section class="completion-card" tabindex="-1"><h2 data-math-text>${\frac x2+y}$ 的取值范围是 $[-1,1]$</h2><p data-math-text>最大值 $1$ 在 $x=1,\ y=\frac12$ 时取到，最小值 $-1$ 在 $x=-1,\ y=-\frac12$ 时取到。</p></section>
  </template>
