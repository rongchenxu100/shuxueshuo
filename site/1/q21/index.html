<section class="rewrite-calculation" aria-label="本次尝试的计算"><div class="rewrite-calculation-math"><p data-math-text>$x+y\cdot \left(\frac1x+\frac1y\right)$</p><p data-math-text>$=x+\frac yx+1$</p></div><div class="rewrite-calculation-feedback"><p data-math-text>条件表达式等于 $3$，只乘第二项后为 $x+3y$，比原式多 $2y$，不等价。</p><p data-math-text>常数与比值项是零次，未乘入的 $x$ 是正一次，整体不是零次齐次式。</p></div></section>
  </template>
  <template id="rewrite-calculation-second-2">
<section class="rewrite-calculation" aria-label="本次尝试的计算"><div class="rewrite-calculation-math"><p data-math-text>$x+y\cdot 1$</p><p data-math-text>$=x+y$</p></div><div class="rewrite-calculation-feedback"><p data-math-text>乘入常数 $1$，改写前后值不变。</p><p data-math-text>仍为 $x+y$，两项都是正一次，尚未配成零次齐次式。</p></div></section>
  </template>
  <template id="rewrite-done">
<div class="visual-board completed-visual"><div class="board-caption">乘入定值 1，配成零次齐次式</div><div class="rewrite-equation" data-math-text>${(x+y)\cdot\frac13\left(\frac1x+\frac1y\right)}$</div><div class="rewrite-equation"><span class="fill-group"><span data-math-text>$=\dfrac23$</span></span><span class="fill-group"><span data-math-text>${}+\dfrac13\Big($</span><span class="shape square expression-slot" data-math-text>$\frac{y}{x}$</span><span>+</span><span class="shape circle expression-slot" data-math-text>$\frac{x}{y}$</span><span data-math-text>$\Big)$</span></span></div></div><div class="reasoning"><span class="section-label">系统计算 · 展开整理</span><p data-math-text>${x+y=(x+y)\cdot\frac13\left(\frac1x+\frac1y\right)}$</p><p data-math-text>$=\frac13\left(1+\frac yx+\frac xy+1\right)$</p><p data-math-text>$=\frac23+\frac13\left(\frac yx+\frac xy\right)$</p></div>
  </template>
  <template id="structure-done">
<div class="visual-board completed-visual"><div class="board-caption">定积求和</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span>·</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span><span>= 1</span></div></div><div class="reasoning"><span class="section-label">根据你的选择，整理思路</span><p data-math-text>$x>0,\ y>0\ \Longrightarrow\ \frac{y}{x}>0,\quad\frac{x}{y}>0$</p><p data-math-text>$\frac{y}{x}\cdot\frac{x}{y}=1$</p><p data-math-text>两项的积固定，要求和的最小值；原式是 $\frac23+\frac13(\cdots)$，系数 $\frac13$ 为正，和最小时原式也最小。</p></div>
  </template>
  <template id="amgm-done">
<div data-completed-amgm data-first="{{first}}" data-second="{{second}}" data-first-label="{{first_math}}" data-second-label="{{second_math}}"></div><div class="reasoning"><span class="section-label">系统计算 · 求和的下界，再代回原式</span><p data-math-text>$\frac{y}{x}+\frac{x}{y}\ge2\sqrt{\frac{y}{x}\cdot\frac{x}{y}}=2$</p><p data-math-text>$5a+3b=\frac23+\frac13\left(\frac yx+\frac xy\right)$</p><p data-math-text>$\ge\frac23+\frac23=\frac43$</p></div><p class="calculation-note">下界已经得到，还需要检查它能否取到。</p>
  </template>
  <template id="equality-done">
<div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 联立取等条件</span><p data-math-text>$\frac{y}{x}=\frac{x}{y}\ \Longrightarrow\ x^2=y^2$</p><p data-math-text>$x,y>0\ \Longrightarrow\ x=y$</p><p data-math-text>$x=y,\quad \frac1x+\frac1y=3\ \Longrightarrow\ x=y=\frac23$</p></div><div class="reasoning"><span class="section-label">系统计算 · 回代原变量并验证</span><p data-math-text>${4a+b=a+2b=\frac23}\ \Longrightarrow\ {b=3a,\ a=\frac2{21},\ b=\frac27}$</p><p data-math-text>$a=\frac2{21}>0,\ b=\frac27>0$，满足原条件。</p><p data-math-text>${5a+3b=\frac{10}{21}+\frac{18}{21}=\frac43}$</p><p data-math-text>由 $a=\frac{2x-y}7>0$、$b=\frac{4y-x}7>0$，$x,y$ 还需满足 $2x>y$、$4y>x$；取等点 $x=y$ 满足，所以下界能取到。</p></div>
  </template>
  <template id="lesson-completion">
<section class="completion-card" tabindex="-1"><h2 data-math-text>$5a+3b$ 的最小值为 $\frac43$</h2><p data-math-text>当 $a=\frac2{21},\ b=\frac27$ 时取到。</p></section>
  </template>
