<section class="rewrite-calculation" aria-label="本次尝试的计算"><div class="rewrite-calculation-math"><p data-math-text>$\frac1a+\frac2b\cdot (2a+b)$</p><p data-math-text>$=\frac1a+\frac{4a}{b}+2$</p></div><div class="rewrite-calculation-feedback"><p data-math-text>由 $a+2b=1$ 得 $2a+b=1+(a-b)$，不保证等于 $1$；这个改写不保证与原式等值。</p><p data-math-text>常数与比值项为零次，未乘入的 $\frac1a$ 仍为负一次，整体不是零次齐次式。</p></div></section>
  </template>
  <template id="rewrite-calculation-second-2">
<section class="rewrite-calculation" aria-label="本次尝试的计算"><div class="rewrite-calculation-math"><p data-math-text>$\frac1a+\frac2b\cdot 1$</p><p data-math-text>$=\frac1a+\frac2b$</p></div><div class="rewrite-calculation-feedback"><p data-math-text>乘入常数 $1$，与原式等值。</p><p data-math-text>仍是原来的两个负一次项，尚未配成零次齐次式。</p></div></section>
  </template>
  <template id="rewrite-done">
<div class="visual-board completed-visual"><div class="board-caption">乘入定值 1，配成零次齐次式</div><div class="rewrite-equation" data-math-text>$\left(\frac1a+\frac2b\right)(a+2b)$</div><div class="rewrite-equation"><span class="fill-group"><span data-math-text>$=5$</span></span><span class="fill-group"><span data-math-text>${}+$</span><span class="shape square expression-slot" data-math-text>$\frac{2b}{a}$</span><span>+</span><span class="shape circle expression-slot" data-math-text>$\frac{2a}{b}$</span></span></div></div><div class="reasoning"><span class="section-label">系统计算 · 展开整理</span><p data-math-text>${\frac1a+\frac2b=\left(\frac1a+\frac2b\right)(a+2b)}$</p><p data-math-text>$=1+\frac{2b}a+\frac{2a}b+4$</p><p data-math-text>$=5+\frac{2b}a+\frac{2a}b$</p></div>
  </template>
  <template id="structure-done">
<div class="visual-board completed-visual"><div class="board-caption">定积求和</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span>·</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span><span>= 4</span></div></div><div class="reasoning"><span class="section-label">根据你的选择，整理思路</span><p data-math-text>$a>0,\ b>0\ \Longrightarrow\ \frac{2b}{a}>0,\quad\frac{2a}{b}>0$</p><p data-math-text>$\frac{2b}{a}\cdot\frac{2a}{b}=4$</p><p data-math-text>两项的积固定，要求和的最小值；原式是 $5+(\cdots)$，和最小时原式也最小。</p></div>
  </template>
  <template id="amgm-done">
<div data-completed-amgm data-first="{{first}}" data-second="{{second}}" data-first-label="{{first_math}}" data-second-label="{{second_math}}"></div><div class="reasoning"><span class="section-label">系统计算 · 求和的下界，再代回原式</span><p data-math-text>$\frac{2b}{a}+\frac{2a}{b}\ge2\sqrt{\frac{2b}{a}\cdot\frac{2a}{b}}=4$</p><p data-math-text>$\frac1a+\frac2b=5+\frac{2b}a+\frac{2a}b\ge5+4=9$</p></div><p class="calculation-note">下界已经得到，还需要检查它能否取到。</p>
  </template>
  <template id="equality-done">
<div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 联立取等条件</span><p data-math-text>$\frac{2b}{a}=\frac{2a}{b}\ \Longrightarrow\ a^2=b^2$</p><p data-math-text>$a,b>0\ \Longrightarrow\ a=b$</p><p data-math-text>$a=b,\quad a+2b=1\ \Longrightarrow\ a=b=\frac13$</p></div><div class="reasoning"><span class="section-label">系统计算 · 回代原变量并验证</span><p data-math-text>${2x-y=x+2y=\frac13}\ \Longrightarrow\ {x=3y,\ y=\frac1{15},\ x=\frac15}$</p><p data-math-text>${x=\frac15>y=\frac1{15}>0}$，${4x+3y=\frac45+\frac15=1}$，满足原条件。</p><p data-math-text>${\frac1{2x-y}+\frac2{x+2y}=3+6=9}$</p><p data-math-text>由 $x=\frac{2a+b}5$、$y=\frac{2b-a}5$，$x>y>0$ 要求 $3a>b$、$2b>a$；取等点 $a=b$ 满足，所以下界能取到。</p></div>
  </template>
  <template id="lesson-completion">
<section class="completion-card" tabindex="-1"><h2 data-math-text>$\frac1{2x-y}+\frac2{x+2y}$ 的最小值为 $9$</h2><p data-math-text>当 $x=\frac15,\ y=\frac1{15}$ 时取到。</p></section>
  </template>
</body>
