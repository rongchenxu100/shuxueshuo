<div class="reasoning" role="group" aria-label="本次填写的展开核对"><span class="section-label">展开核对 · 你填的乘积值为 2</span><p data-math-text>$(2a+1)(b+1)=2ab+2a+b+1$</p><p data-math-text>$=3+1=4\ne 2$</p><p data-math-text>展开后比条件表达式多 $1$，乘积的值也应比 $3$ 多 $1$。请核对你填写的 $2$。</p></div>

  <template id="eliminate-done">
<div class="visual-board completed-visual"><div class="board-caption">消参：用 b 表示整体 2a+1</div><div class="function-conversion"><div><span class="conversion-label">条件</span><div class="math" data-math-text>$(2a+1)(b+1)=4$</div></div><span class="conversion-arrow" aria-hidden="true">→</span><div><span class="conversion-label">用 b 表示</span><div class="math" data-math-text>$\dfrac1{2a+1}=\dfrac{b+1}4$</div></div></div></div><div class="reasoning"><span class="section-label">系统计算 · 范围与拆项</span><p data-math-text>由 $a&gt;0$ 得 $2a+1&gt;1$，所以 ${b+1=\frac4{2a+1}&lt;4}$；又 $b&gt;0$，所以 ${0&lt;b&lt;3}$</p><p data-math-text>$\frac1{2a+1}+\frac1b=\frac{b+1}4+\frac1b$</p><p data-math-text>$=\frac b4+\frac1b+\frac14$</p><p data-math-text>目标中 $a$ 只以整体 $2a+1$ 出现，用 $b$ 表示这个整体即可，不必解出 $a$。若反过来保留 $a$，会得到 ${\frac1{2a+1}+\frac{2a+1}{3-2a}}$，不便配成定积。</p></div>
  </template>

  </template>

  </template>

<div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 联立取等条件</span><p data-math-text>由 $\frac b4=\frac1b$ 得 $b^2=4$</p><p data-math-text>又 $b&gt;0$，所以 $b=2$，在 ${0&lt;b&lt;3}$ 内</p><p data-math-text>$2a+1=\frac4{b+1}=\frac43$，所以 $a=\frac16&gt;0$</p></div><div class="reasoning"><span class="section-label">系统计算 · 验证原条件</span><p data-math-text>$2\cdot\frac16\cdot2+2\cdot\frac16+2=\frac23+\frac13+2=3$</p><p data-math-text>$\frac1{2a+1}+\frac1b=\frac34+\frac12=\frac54$</p></div>
  </template>
