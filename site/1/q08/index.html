  <template id="matching-rewrite-done"><div class="visual-board completed-visual"><div class="board-caption">配成两个正项的和</div><div class="function-conversion"><div><span class="conversion-label">原式</span><div class="math" data-math-text>$\frac{x^2+y^2+6}{x+y}$</div></div><span class="conversion-arrow" aria-hidden="true">→</span><div class="formula conversion-terms"><span class="shape square expression-slot" data-math-text>$x+y$</span><span>+</span><span class="shape circle expression-slot" data-math-text>$\frac4{x+y}$</span></div></div></div><div class="reasoning"><span class="section-label">系统计算 · 等价改写</span><p data-math-text>$x^2+y^2+6=(x+y)^2-2xy+6=(x+y)^2+4$</p><p data-math-text>$\frac{x^2+y^2+6}{x+y}=\frac{(x+y)^2+4}{x+y}=x+y+\frac4{x+y}$</p></div></template>

  <template id="symmetric-symmetry-done"><div class="sym-check completed-visual"><div class="sym-row"><span class="sym-label">条件</span><div class="sym-exprs"><span class="sym-expr" data-math-text>$xy=1$</span><span class="sym-arrow"><span class="sr-only">交换 x、y 后变为</span><span aria-hidden="true"><i class="sym-x">x</i>⇄<i class="sym-y">y</i></span></span><span class="sym-expr" data-math-text>$yx=1$</span></div><span class="sym-verdict">不变</span></div><div class="sym-row"><span class="sym-label">目标</span><div class="sym-exprs"><span class="sym-expr" data-math-text>$\displaystyle\frac{x^2+y^2+6}{x+y}$</span><span class="sym-arrow"><span class="sr-only">交换 x、y 后变为</span><span aria-hidden="true"><i class="sym-x">x</i>⇄<i class="sym-y">y</i></span></span><span class="sym-expr" data-math-text>$\displaystyle\frac{y^2+x^2+6}{y+x}$</span></div><span class="sym-verdict">不变</span></div></div><div class="reasoning"><span class="section-label">根据你的判断，确认对称结构</span><p data-math-text>条件和目标交换 $x$、$y$ 后都不变，$x>0,\ y>0$ 的取值范围也不变。</p></div></template>
  <template id="symmetric-substitution-done"><div class="visual-board completed-visual"><div class="board-caption">用和与积表示</div><div class="substitution-definitions"><div class="formula"><span data-math-text>$s=$</span><span class="shape square expression-slot" data-math-text>$x+y$</span></div><div class="formula"><span data-math-text>$p=$</span><span class="shape circle expression-slot" data-math-text>$xy$</span></div></div></div><div class="reasoning"><span class="section-label">系统计算 · 代入并化简</span><p data-math-text>$x^2+y^2=s^2-2p$</p><p data-math-text>$p=1,\quad s>0,\quad s^2\ge4p\ \Longrightarrow\ s\ge2$</p><p data-math-text>$\frac{s^2-2p+6}{s}=\frac{s^2+4}{s}=s+\frac4s$</p></div></template>

  <template id="matching-equality-done"><div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 代回并验证</span><p data-math-text>$x+y=\frac4{x+y},\quad x+y>0\ \Longrightarrow\ x+y=2$</p><p data-math-text>$(x-y)^2=(x+y)^2-4xy=4-4=0$</p><p data-math-text>$x=y,\quad x+y=2\ \Longrightarrow\ x=y=1$</p><p data-math-text>$x=y=1>0,\quad xy=1,\quad \frac{1+1+6}{1+1}=4$</p><p data-math-text>满足原条件，下界可以取到。</p></div></template>

  <template id="symmetric-equality-done"><div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 代回并验证</span><p data-math-text>$s=\frac4s,\quad s\ge2\ \Longrightarrow\ s=2$</p><p data-math-text>$p=1,\quad s^2-4p=0\ \Longrightarrow\ x=y$</p><p data-math-text>$x+y=2\ \Longrightarrow\ x=y=1$</p><p data-math-text>$x=y=1>0,\quad xy=1,\quad \frac{1+1+6}{1+1}=4$</p><p data-math-text>满足原条件，下界可以取到。</p></div></template>
