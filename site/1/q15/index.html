<div class="visual-board completed-visual"><div class="board-caption">定积求和</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span>·</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span><span>= 4</span></div></div><div class="reasoning"><span class="section-label">根据你的选择，整理思路</span><p data-math-text>$a,b>0\ \Longrightarrow\ \frac{2b}a>0,\quad\frac{2a}b>0$</p><p data-math-text>$\frac{2b}a\cdot\frac{2a}b=4$</p><p data-math-text>两项的积固定，要求和的最小值；原式还包含常数 $2$。</p></div>

  <template id="amgm-done">
