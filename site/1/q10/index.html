  <script type="application/json" id="practice-config">
{

        "id": "homogeneity",

            "目标表达式的次数",

          ]
        },
        "expected_answer": {
          "terms": [
            "-1",
            "1"

        },
        "feedback": {
          "terms": "判断次数时，先看每一项中变量的指数，数字系数不计入次数。$5/x=5x^{-1}$、$4/y=4y^{-1}$，两项都是负一次，所以目标是负一次齐次式；$x$、$5y$ 中变量的指数都是 $1$，所以条件表达式是正一次齐次式。相加时不把次数相加，只有相乘时才把次数相加。"

        "display": "homogeneity-done",

        "board": "degree-board"

          "structure": "两项的积固定为 $100$，要求它们和的最小值。"
        },
        "display": "structure-done",
        "submit_label": "确认判断"
      },
      {
        "id": "amgm",
        "title": "应用基本不等式",
        "question": "对这两个正项应用基本不等式，能得到什么关系？",
        "interaction": {
          "type": "amgm",
          "terms": [
            "25y/x",
            "4x/y"
          ],
          "term_labels": {

            "4x/y": "$\\frac{4x}{y}$"

            "4x/y"

          "type": "equality",
          "terms": [
            "25y/x",
            "4x/y"
          ],
          "term_labels": {
            "25y/x": "$\\frac{25y}{x}$",
            "4x/y": "$\\frac{4x}{y}$"
          }
        },
        "expected_answer": {
          "terms": [
            "25y/x",
            "4x/y"
          ]
        },
        "feedback": {
          "terms": "取等要求应用基本不等式的两个比值项相等。"
        },
        "display": "equality-done",
        "submit_label": "确认判断"

  <template id="degree-board">
<div class="visual-board deg-board"><div class="deg-equation"><div class="deg-factor deg-target"><span class="deg-label">目标</span><span class="deg-expr" data-math-text>$\dfrac5x+\dfrac4y$</span><span class="deg-degree"><span class="deg-degree-label">次数</span><span data-degree="0"></span></span></div><span class="deg-op" aria-hidden="true">×</span><div class="deg-factor deg-condition"><span class="deg-label">条件表达式 = 1</span><span class="deg-expr" data-math-text>$x+5y$</span><span class="deg-degree"><span class="deg-degree-label">次数</span><span data-degree="1"></span></span></div><span class="deg-op deg-op-equal" aria-hidden="true">=</span><div class="deg-factor deg-result"><span class="deg-label">相乘后</span><span data-degree-total></span></div></div></div>
  </template>
  <template id="homogeneity-done">
<div class="visual-board deg-board completed-visual"><div class="deg-equation"><div class="deg-factor deg-target"><span class="deg-label">目标</span><span class="deg-expr" data-math-text>$\dfrac5x+\dfrac4y$</span><span class="deg-degree"><span class="deg-degree-label">次数</span><span class="deg-badge">−1</span></span></div><span class="deg-op" aria-hidden="true">×</span><div class="deg-factor deg-condition"><span class="deg-label">条件表达式 = 1</span><span class="deg-expr" data-math-text>$x+5y$</span><span class="deg-degree"><span class="deg-degree-label">次数</span><span class="deg-badge">+1</span></span></div><span class="deg-op deg-op-equal" aria-hidden="true">=</span><div class="deg-factor deg-result"><span class="deg-label">相乘后</span><div class="deg-total"><span class="deg-total-value">0 次</span><span class="deg-total-sum" data-math-text>$(-1)+(+1)=0$</span></div></div></div></div><div class="reasoning"><span class="section-label">根据你的判断，整理思路</span><p data-math-text>目标为负一次，条件表达式为正一次，相乘可配成零次齐次式。</p><p data-math-text>$x+5y=1$，乘入这个定值可以保持原式的值不变。</p></div>
  </template>
  <template id="rewrite-scope">
<div class="visual-board rw-board"><span class="rw-caption">原式 · 点选要乘入的部分</span><div class="rw-source" role="group" aria-label="作用范围"><button type="button" class="rw-target rw-whole" data-rewrite-scope="whole"><span class="rw-legend">整个式子</span></button><div class="rw-terms"><button type="button" class="rw-target rw-term" data-rewrite-scope="first" aria-label="第一项 5/x"><span data-math-text>$\dfrac5x$</span></button><span class="rw-op">+</span><button type="button" class="rw-target rw-term" data-rewrite-scope="second" aria-label="第二项 4/y"><span data-math-text>$\dfrac4y$</span></button></div></div><span data-rewrite-result></span></div>
  </template>
  <template id="rewrite-whole">
<div class="rw-result"><span class="rw-preview-label">尝试改写</span><span class="rw-focus"><span data-math-text>$\left(\dfrac5x+\dfrac4y\right)$</span><span class="rw-times">×</span><span data-rewrite-factor></span></span></div>
  </template>
  <template id="rewrite-first">
<div class="rw-result"><span class="rw-preview-label">尝试改写</span><span class="rw-focus"><span data-math-text>$\dfrac5x$</span><span class="rw-times">×</span><span data-rewrite-factor></span></span><span class="rw-op">+</span><span data-math-text>$\dfrac4y$</span></div>
  </template>
  <template id="rewrite-second">
<div class="rw-result"><span class="rw-preview-label">尝试改写</span><span data-math-text>$\dfrac5x$</span><span class="rw-op">+</span><span class="rw-focus"><span data-math-text>$\dfrac4y$</span><span class="rw-times">×</span><span data-rewrite-factor></span></span></div>
  </template>
  <template id="rewrite-done">
<div class="visual-board completed-visual"><div class="board-caption">乘入定值 1，配成零次齐次式</div><div class="rewrite-equation" data-math-text>$\left(\frac5x+\frac4y\right)(x+5y)$</div><div class="rewrite-equation"><span>= 25 +</span><span class="shape square expression-slot" data-math-text>$\frac{25y}{x}$</span><span>+</span><span class="shape circle expression-slot" data-math-text>$\frac{4x}{y}$</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 展开整理</span><p data-math-text>$\frac5x+\frac4y=\left(\frac5x+\frac4y\right)(x+5y)$</p><p data-math-text>$=5+\frac{25y}{x}+\frac{4x}{y}+20$</p><p data-math-text>$=25+\frac{25y}{x}+\frac{4x}{y}$</p></div>
  </template>
  <template id="structure-done">
<div class="visual-board completed-visual"><div class="board-caption">定积求和</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span>·</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span><span>= 100</span></div></div><div class="reasoning"><span class="section-label">根据你的选择，整理思路</span><p data-math-text>$x,y>0\ \Longrightarrow\ \frac{25y}{x}>0,\quad\frac{4x}{y}>0$</p><p data-math-text>$\frac{25y}{x}\cdot\frac{4x}{y}=100$</p><p data-math-text>两项的积固定，要求和的最小值；原式还包含常数 $25$。</p></div>
  </template>
  <template id="amgm-done">
<div data-completed-amgm data-first="{{first}}" data-second="{{second}}" data-first-label="{{first_math}}" data-second-label="{{second_math}}"></div><div class="reasoning"><span class="section-label">系统计算 · 求和的下界，再加回常数</span><p data-math-text>$\frac{25y}{x}+\frac{4x}{y}\ge2\sqrt{\frac{25y}{x}\cdot\frac{4x}{y}}=20$</p><p data-math-text>$\frac5x+\frac4y=25+\frac{25y}{x}+\frac{4x}{y}\ge25+20=45$</p></div><p class="calculation-note">下界已经得到，还需要检查它能否取到。</p>
  </template>
  <template id="equality-done">
<div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 联立取等条件</span><p data-math-text>$\frac{25y}{x}=\frac{4x}{y}\ \Longrightarrow\ 25y^2=4x^2$</p><p data-math-text>$x,y>0\ \Longrightarrow\ 2x=5y$</p><p data-math-text>$2x=5y,\quad x+5y=1\ \Longrightarrow\ x=\frac13,\quad y=\frac2{15}$</p></div><div class="reasoning"><span class="section-label">系统计算 · 验证原条件</span><p data-math-text>$x=\frac13>0,\quad y=\frac2{15}>0$</p><p data-math-text>$x+5y=\frac13+5\cdot\frac2{15}=1$</p><p data-math-text>$\frac5x+\frac4y=15+30=45$</p></div>
  </template>
  <template id="lesson-completion">
<section class="completion-card" tabindex="-1"><h2 data-math-text>$\frac5x+\frac4y$ 的最小值为 $45$</h2><p data-math-text>当 $x=\frac13,\ y=\frac2{15}$ 时取到。</p></section>
  </template>
