    <section class="problem-card" aria-labelledby="problem-title">
      <h1 id="problem-title">原题</h1>
      <p>设正实数 <span class="math"><i>m</i>、<i>n</i></span> 满足 <span class="math nowrap"><i>m</i> + <i>n</i> = 2</span>，求 <span class="math"><i>mn</i></span> 的最大值。</p>
      <section class="meaning-panel" aria-labelledby="meaning-title">
        <div class="meaning-heading"><h2 id="meaning-title">题意整理</h2><span>根据原题转写</span></div>
        <dl class="problem-meaning" aria-label="题意的数学表达">
        <div class="meaning-row"><dt>条件</dt><dd><span class="math nowrap"><i>m</i> &gt; 0，<i>n</i> &gt; 0</span><span class="math nowrap"><i>m</i> + <i>n</i> = 2</span></dd></div>
        <div class="meaning-row"><dt>目标</dt><dd><span class="math nowrap" aria-label="求 mn 的最大值">(<i>mn</i>)<sub>max</sub></span></dd></div>
        </dl>
      </section>
    </section>

      </div>

  <!-- Student-facing course content and local component answers. Teacher contracts live on the server. -->
  <script type="application/json" id="practice-config">
{
  "id": "q01",
  "version": 5,
  "variables": [
    "m",
    "n"
  ],
  "method_question": "这道题，你准备采用哪种解题方案？",
  "methods": [
    {
      "id": "direct",
      "label": "直接应用基本不等式"
    },
    {
      "id": "1",
      "label": "消参法"
    }
  ],
  "routes": {
    "direct": [
      {
        "id": "structure",
        "title": "观察结构",
        "question": "定和求积还是定积求和？",
        "interaction": {
          "type": "structure",
          "terms": [
            "m",
            "n"
          ]
        },
        "expected_answer": {
          "terms": [
            "m",
            "n"
          ],
          "fixed": "sum",
          "target": "product"
        },
        "feedback": {
          "terms": "两个位置需要分别对应题目中的 m 和 n。",
          "structure": "再看看题目：固定的是 m + n，要求的是 mn 的最大值。"
        },
        "submit_label": "确认结构",
        "display": "structure-done"
      },
      {
        "id": "amgm",
        "title": "应用基本不等式",
        "question": "对 m、n 应用基本不等式，能得到什么关系？",
        "interaction": {
          "type": "amgm",
          "terms": [
            "m",
            "n"
          ]
        },
        "expected_answer": {
          "terms": [
            "m",
            "n"
          ]
        },
        "feedback": {
          "terms": "两个位置需要分别对应题目中的 m 和 n。"
        },
        "submit_label": "确认代入",
        "display": "amgm-done"
      },
      {
        "id": "equality",
        "title": "验证取等",
        "question": "什么条件下，刚才的基本不等式能取等号？",
        "interaction": {
          "type": "equality",
          "terms": [
            "m",
            "n"
          ]
        },
        "expected_answer": {
          "terms": [
            "m",
            "n"
          ]
        },
        "feedback": {
          "terms": "两个位置需要分别对应题目中的 m 和 n。"
        },
        "submit_label": "确认取等",
        "display": "equality-done"
      }
    ],
    "1": [
      {
        "id": "eliminate",
        "title": "观察结构",
        "question": "利用 m + n = 2，你准备怎样消去一个变量？",
        "interaction": {
          "type": "choice",
          "field": "variable",
          "options": [
            {
              "value": "m",
              "label": "$n=2-m$"
            },
            {
              "value": "n",
              "label": "$m=2-n$"
            }
          ],
          "description": "保留的变量：m 表示 n=2-m，n 表示 m=2-n"
        },
        "expected_answer": {
          "one_of": [
            "m",
            "n"
          ]
        },
        "feedback": {
          "answer": "还需要表达你对这个问题的判断。"
        },
        "submit_label": "确认消参",
        "board": "eliminate-board",
        "display": "eliminate-done"
      },
      {
        "id": "quadratic",
        "title": "求二次式的上界",
        "question": "怎样判断这个二次式的最大值？",
        "interaction": {
          "type": "choice",
          "field": "technique",
          "options": [
            {
              "value": "square",
              "label": "配方，看平方项的取值"
            },
            {
              "value": "vertex",
              "label": "利用二次函数的顶点"
            }
          ],
          "description": "square为配方，vertex为二次函数顶点；系统完成后续计算"
        },
        "expected_answer": {
          "one_of": [
            "square",
            "vertex"
          ]
        },
        "feedback": {
          "answer": "还需要表达你对这个问题的判断。"
        },
        "submit_label": "确认思路",
        "board": "quadratic-board",
        "display": {
          "field": "technique",
          "options": {
            "square": "square-done",
            "vertex": "vertex-done"
          }
        }
      },
      {
        "id": "feasibility",
        "title": "验证取值",
        "question": "这个取值满足原题的所有条件吗？",
        "interaction": {
          "type": "choice",
          "field": "feasible",
          "options": [
            {
              "value": "yes",
              "label": "满足：两数为正，且和为 2"

            {
              "value": "no",
              "label": "不满足原题条件"
            }
          ],
          "description": "验证取值满足原题条件，yes为满足，no为不满足"
        },
        "expected_answer": {
          "one_of": [
            "yes"
          ]
        },
        "feedback": {
          "answer": "把 m = n = 1 代回原题：两数是否都为正？它们的和是不是 2？"
        },
        "submit_label": "确认验证",

      }
    ]
  },
  "completion": "lesson-completion",
  "comparisons": {

  }
}

  <template id="eliminate-done">
<div class="selected-method"><span>你选择的方案</span><span class="method-pill">消参法</span></div>
      <div class="visual-board completed-visual"><div class="board-caption">消去一个变量</div><div class="formula"><span><i>{{other}}</i> = 2 − <i>{{variable}}</i></span></div></div>
      <div class="reasoning"><span class="section-label">系统计算 · 代入目标式</span><p class="math"><i>mn</i> = <i>{{variable}}</i>(2 − <i>{{variable}}</i>) = 2<i>{{variable}}</i> − <i>{{variable}}</i><sup>2</sup></p><p class="math">∵ <i>{{variable}}</i> &gt; 0，2 − <i>{{variable}}</i> &gt; 0</p><p class="math">∴ 0 &lt; <i>{{variable}}</i> &lt; 2</p></div>
  </template>
  <template id="square-done">
<div class="visual-board completed-visual"><div class="board-caption">配方：把二次式转化为“常数 − 平方项”</div>
        <div class="function-conversion">
          <div><span class="conversion-label">二次式求最大值</span><div class="math">(2<i>{{variable}}</i> − <i>{{variable}}</i><sup>2</sup>)<sub>max</sub></div></div>
          <span class="conversion-arrow" aria-hidden="true">→</span>
          <div><span class="conversion-label">平方项越小，原式越大</span><div class="math">1 − <span class="square-term">(<i>{{variable}}</i> − 1)<sup>2</sup></span></div><span class="conversion-label">平方项 ≥ 0，所以原式 ≤ 1</span></div>
        </div></div>
        <div class="reasoning"><span class="section-label">系统计算 · 配方求上界</span>
        <p class="math"><i>mn</i> = 2<i>{{variable}}</i> − <i>{{variable}}</i><sup>2</sup></p>
        <p class="math">= −(<i>{{variable}}</i><sup>2</sup> − 2<i>{{variable}}</i> + 1) + 1</p>
        <p class="math">= 1 − (<i>{{variable}}</i> − 1)<sup>2</sup></p>
        <p class="math">∵ (<i>{{variable}}</i> − 1)<sup>2</sup> ≥ 0</p>
        <p class="math">∴ <i>mn</i> ≤ 1</p>
        <p class="math">等号成立 ⇔ (<i>{{variable}}</i> − 1)<sup>2</sup> = 0 ⇔ <i>{{variable}}</i> = 1。</p>
        <p class="math">代回 <i>{{other}}</i> = 2 − <i>{{variable}}</i>，得到 <i>{{other}}</i> = 1。</p></div><p class="calculation-note">还需要检查这个取值是否满足原题条件。</p>
  </template>
  <template id="feasible-done">
<div class="visual-board completed-visual"><div class="board-caption">满足原题条件</div><div class="formula"><i>m</i> = <i>n</i> = 1</div></div>
      <div class="reasoning"><span class="section-label">系统计算 · 验证取值</span><p class="math">✓ <i>m</i> = 1 &gt; 0，<i>n</i> = 1 &gt; 0</p><p class="math">✓ <i>m</i> + <i>n</i> = 1 + 1 = 2</p><p class="math">∴ <i>mn</i> = 1，上界可以取到。</p></div>
  </template>
  <template id="vertex-done">
<div class="visual-board completed-visual">
      <div class="board-caption">从二次式的最值，转化为二次函数的最值</div>
      <div class="function-conversion">
        <div><span class="conversion-label">二次式求最大值</span><div class="math">(2<i>{{variable}}</i> − <i>{{variable}}</i><sup>2</sup>)<sub>max</sub></div></div>
        <span class="conversion-arrow" aria-hidden="true">→</span>
        <div><span class="conversion-label">二次函数求最大值</span><div class="math"><i>y</i> = −<i>{{variable}}</i><sup>2</sup> + 2<i>{{variable}}</i></div><span class="conversion-label">求 <span class="math"><i>y</i><sub>max</sub></span>，其中 <span class="math">0 &lt; <i>{{variable}}</i> &lt; 2</span></span></div>
      </div>
    </div>
    <div class="reasoning vertex-reasoning">
      <div><span class="section-label">系统计算 · 二次函数求最值</span>
        <p class="math">令 <i>y</i> = <i>mn</i> = −<i>{{variable}}</i><sup>2</sup> + 2<i>{{variable}}</i>。</p>
        <p class="math">∵ 二次项系数 −1 &lt; 0，抛物线开口向下。</p>
        <p class="math">对称轴：<i>{{variable}}</i> = −2 ÷ (2 × (−1)) = 1</p>
        <p class="math">∵ 1 ∈ (0, 2)，顶点在定义域内。</p>
        <p class="math">∴ <i>y</i><sub>max</sub> = −(1)<sup>2</sup> + 2 × 1 = 1</p>
        <p class="math">即 <i>mn</i> ≤ 1，在 <i>{{variable}}</i> = 1 时取等。</p>
        <p class="math">代回 <i>{{other}}</i> = 2 − <i>{{variable}}</i>，得 <i>{{other}}</i> = 1。</p>
      </div>
      <figure class="quadratic-graph"><div data-quadratic-graph="{&quot;coefficient&quot;: -1, &quot;vertex&quot;: [1, 1], &quot;bounds&quot;: [-0.3, 2.5, -0.22, 1.32], &quot;domain&quot;: [0, 2], &quot;excluded&quot;: [0, 2], &quot;xTicks&quot;: [[0, &quot;0&quot;], [1, &quot;1&quot;], [2, &quot;2&quot;]], &quot;yLabel&quot;: &quot;1&quot;, &quot;variable&quot;: &quot;{{variable}}&quot;, &quot;title&quot;: &quot;y = −{{variable}}² + 2{{variable}} 的图像&quot;, &quot;description&quot;: &quot;横轴为 {{variable}}，纵轴 y=mn。定义域为 (0,2)，两端不取，抛物线开口向下，顶点 (1,1)。&quot;, &quot;uid&quot;: &quot;{{uid}}-quadratic&quot;}"></div><figcaption data-math-text>$y=mn$，$0<{{variable}}<2$；空心点表示端点不取。</figcaption></figure>
    </div><p class="calculation-note">还需要检查这个取值是否满足原题条件。</p>
  </template>
  <template id="structure-done">
<div class="selected-method"><span>你选择的方案</span><span class="method-pill">直接应用基本不等式</span></div>
        <div class="visual-board completed-visual"><div class="structure-summary"><div class="summary-item"><span class="summary-label">定和</span><div class="formula"><span class="shape square">{{first}}</span> + <span class="shape circle">{{second}}</span></div></div><span class="flow-arrow" aria-hidden="true">→</span><div class="summary-item"><span class="summary-label">求积</span><div class="formula"><span class="shape square">{{first}}</span> · <span class="shape circle">{{second}}</span></div></div></div></div>
        <div class="reasoning"><span class="section-label">根据你的选择，整理思路</span><p><span class="reason-symbol">∵</span><span class="math"><i>m</i>, <i>n</i> &gt; 0，<i>m</i> + <i>n</i> = 2</span>，目标是求 <span class="math"><i>mn</i></span> 的最大值。</p><p><span class="reason-symbol">∴</span>定和求积，可以直接应用基本不等式。</p></div>
  </template>
  <template id="amgm-done">
    <div data-completed-amgm data-first="{{first}}" data-second="{{second}}" data-first-label="{{first_math}}" data-second-label="{{second_math}}"></div>
    <details class="details" id="{{uid}}-derivation" open><summary>完整推导</summary><p class="math">∵ <i>m</i> &gt; 0，<i>n</i> &gt; 0</p><p class="math">∴ <i>m</i> + <i>n</i> ≥ 2<span class="radical"><span class="root-sign">√</span><span class="radicand"><i>mn</i></span></span></p><p class="math">∵ <i>m</i> + <i>n</i> = 2</p><p class="math">∴ 2 ≥ 2<span class="radical"><span class="root-sign">√</span><span class="radicand"><i>mn</i></span></span></p><p class="math">∴ 1 ≥ <span class="radical"><span class="root-sign">√</span><span class="radicand"><i>mn</i></span></span>，<i>mn</i> ≤ 1</p></details><p class="calculation-note">上界已经得到，还需要检查它能否取到。</p>
  </template>
  <template id="equality-done">
<div class="visual-board completed-visual"><div class="board-caption">你给出的取等条件</div><div class="formula"><span class="shape square">{{first}}</span> <span class="equal-sign">=</span> <span class="shape circle">{{second}}</span></div></div>
      <div class="reasoning"><span class="section-label">系统计算 · 验证取等</span><p><span class="reason-symbol">∵</span><span class="math"><i>m</i> = <i>n</i>，<i>m</i> + <i>n</i> = 2</span></p><p><span class="reason-symbol">∴</span><span class="math"><i>m</i> = <i>n</i> = 1</span></p><p><span class="reason-symbol">✓</span>满足两数为正、和为 2，且 <span class="math"><i>mn</i> = 1</span>。上界可以取到。</p></div>
  </template>
  <template id="eliminate-board">

  </template>
  <template id="quadratic-board">
<div class="visual-board"><div class="board-caption">消参后的目标式</div><div class="formula"><span><i>mn</i> = 2<i>{{variable}}</i> − <i>{{variable}}</i><sup>2</sup></span></div></div>
  </template>
  <template id="feasible-board">
<div class="visual-board"><div class="board-caption">取得上界时的取值</div><div class="formula"><i>m</i> = <i>n</i> = 1</div></div>
  </template>
  <template id="lesson-completion">
<section class="completion-card" tabindex="-1"><h2><span class="math"><i>mn</i></span> 的最大值为 <span class="math">1</span></h2><p>当 <span class="math"><i>m</i> = <i>n</i> = 1</span> 时取到。</p></section>
  </template>
  <template id="comparison">
<aside class="route-comparison"><h3>再看一种思路</h3><p>你用消参法，把目标转成了二次式。观察到两正数的和固定，也可以直接用基本不等式得到上界。</p><p class="math">2 = <i>m</i> + <i>n</i> ≥ 2<span class="radical"><span class="root-sign">√</span><span class="radicand"><i>mn</i></span></span>，所以 <i>mn</i> ≤ 1。</p><p>两种方法都在 <span class="math"><i>m</i> = <i>n</i> = 1</span> 时取得最大值。</p></aside>
  </template>
</body>
