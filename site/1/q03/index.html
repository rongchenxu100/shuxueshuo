<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f7f5">
  <title>Q03 · 基本不等式 · 数学说</title>
  <link rel="stylesheet" href="/assets/practice/vendor/katex-0.18.9/katex.min.css">
  <link rel="stylesheet" href="/assets/practice/practice.css?v=32">
  <script src="/assets/practice/vendor/katex-0.18.9/katex.min.js" defer></script>
  <script src="/assets/practice/vendor/katex-0.18.9/auto-render.min.js" defer></script>
  <script src="/assets/practice/math-text.js?v=10" defer></script>
  <script src="/assets/practice/components.js?v=20" defer></script>
  <script src="/assets/practice/context.js?v=13" defer></script>
  <script src="/assets/practice/runtime.js?v=22" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="数学说首页"><span class="brand-mark" aria-hidden="true">数</span>数学说</a>
      <span class="demo-label">基本不等式</span>
      <button type="button" class="reset-button" id="reset">↺ <span>重新练习</span></button>
    </div>
  </header>

  <main class="workspace">
    <div class="eyebrow"><span><a class="chapter-return" href="/1/">← 返回题库</a> <span class="separator">/</span> Q03</span></div>
    <section class="problem-card" aria-labelledby="problem-title">
      <h1 id="problem-title">原题</h1>
      <p data-math-text>已知 $x>0,\ y>0,\ xy=4$，则 $x+2y$ 的最小值为？</p>
      <section class="meaning-panel" aria-labelledby="meaning-title">
        <div class="meaning-heading"><h2 id="meaning-title">题意整理</h2><span>根据原题转写</span></div>
        <dl class="problem-meaning" aria-label="题意的数学表达">
          <div class="meaning-row"><dt>条件</dt><dd><span data-math-text>$x>0,\quad y>0,\quad xy=4$</span></dd></div>
          <div class="meaning-row"><dt>目标</dt><dd><span data-math-text>$(x+2y)_{\min}$</span></dd></div>
        </dl>
      </section>
    </section>
    <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
    <section id="attempt-history" aria-label="之前的路径尝试"></section>
    <section id="steps" aria-label="逐步解题"></section>
    <div id="completion" hidden></div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <div class="composer-heading"><span class="focus-dot" aria-hidden="true"></span><span id="conversation-focus">正在讨论：观察结构</span></div>
      <div class="input-shell">
        <textarea id="message" rows="1" placeholder="也可以在这里说说你的思路…" aria-label="你的思路"></textarea>
        <button class="send-button" type="button" disabled aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-5 14-2-6-7-1Zm7 1 7-8"/></svg></button>
      </div>
      <div class="network-feedback"><span id="network-status" role="status" aria-live="polite"></span><button id="request-retry" type="button" hidden>重试</button></div>
    </div>
  </footer>
  <div id="picker" class="token-picker" role="dialog" aria-label="选择数学项" hidden>
    <span class="picker-label">选择数学项</span>
    <div class="picker-options"></div>
  </div>
  <div id="announcement" class="sr-only" aria-live="polite" role="status"></div>

  <script type="application/json" id="practice-config">
{
  "id": "q03",
  "version": 2,
  "variables": [
    "x",
    "y"
  ],
  "method_question": "这道题，你准备采用哪种解题方案？",
  "methods": [
    {
      "id": "direct",
      "label": "直接应用基本不等式"
    }
  ],
  "routes": {
    "direct": [
      {
        "id": "structure",
        "title": "观察结构",
        "question": "这两项是定和求积，还是定积求和？",
        "interaction": {
          "type": "structure",
          "terms": [
            "x",
            "y",
            "2y"
          ],
          "term_labels": {
            "x": "$x$",
            "y": "$y$",
            "2y": "$2y$"
          }
        },
        "expected_answer": {
          "terms": [
            "x",
            "2y"
          ],
          "fixed": "product",
          "target": "sum"
        },
        "feedback": {
          "terms": "所选两项尚未对应目标式。对 x、y 用基本不等式可得 x+y≥4，这个结论成立，但还没有得到 x+2y 的最小值。本步可选择 x、2y，直接研究目标式。",
          "structure": "由 xy=4 可知 x·2y=8，固定的是积；x+y 和 x+2y 都不是定和。本题要研究 x+2y 的最小值，是定积求和。"
        },
        "submit_label": "确认结构",
        "display": "direct-structure-done"
      },
      {
        "id": "amgm",
        "title": "应用基本不等式",
        "question": "对 $x$、$2y$ 应用基本不等式，能得到什么关系？",
        "interaction": {
          "type": "amgm",
          "terms": [
            "x",
            "2y"
          ],
          "term_labels": {
            "x": "$x$",
            "2y": "$2y$"
          }
        },
        "expected_answer": {
          "terms": [
            "x",
            "2y"
          ]
        },
        "feedback": {
          "terms": "两个位置需要分别对应 x 和 2y。"
        },
        "submit_label": "确认关系",
        "display": "direct-amgm-done"
      },
      {
        "id": "equality",
        "title": "验证取等",
        "question": "什么条件下，刚才的基本不等式能取等号？",
        "interaction": {
          "type": "equality",
          "terms": [
            "x",
            "y",
            "2y"
          ],
          "term_labels": {
            "x": "$x$",
            "y": "$y$",
            "2y": "$2y$"
          }
        },
        "expected_answer": {
          "terms": [
            "x",
            "2y"
          ]
        },
        "feedback": {
          "terms": "取等要求参与不等式的两项相等：x=2y，而不是 x=y。"
        },
        "submit_label": "确认取等",
        "display": "direct-equality-done"
      }
    ]
  },
  "completion": "lesson-completion"
}
  </script>

  <template id="direct-structure-done">
    <div class="visual-board completed-visual">
      <div class="structure-summary">
        <div class="summary-item"><span class="summary-label">定积</span><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span> · <span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div>
        <span class="flow-arrow" aria-hidden="true">→</span>
        <div class="summary-item"><span class="summary-label">求和</span><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span> + <span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div>
      </div>
    </div>
    <div class="reasoning"><span class="section-label">根据你的选择，整理思路</span>
      <p data-math-text>$x>0,\quad y>0\ \Longrightarrow\ 2y>0$</p>
      <p data-math-text>$x\cdot2y=2xy=8$</p>
      <p>两正项的积固定，要求和的最小值，可以应用基本不等式。</p>
    </div>
  </template>
  <template id="direct-amgm-done">
    <div data-completed-amgm data-first="{{first}}" data-second="{{second}}" data-first-label="{{first_math}}" data-second-label="{{second_math}}"></div>
    <details class="details" id="{{uid}}-derivation" open><summary>完整推导</summary>
      <p data-math-text>$x>0,\quad 2y>0$</p>
      <p data-math-text>$x+2y\ge2\sqrt{x\cdot2y}=2\sqrt{2xy}$</p>
      <p data-math-text>$xy=4\ \Longrightarrow\ x+2y\ge2\sqrt8=4\sqrt2$</p>
    </details><p class="calculation-note">下界已经得到，还需要检查它能否取到。</p>
  </template>
  <template id="direct-equality-done">
    <div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div>
    <div class="reasoning"><span class="section-label">系统计算 · 验证取等</span>
      <p data-math-text>$\begin{cases}x=2y\\xy=4\end{cases}\ \Longrightarrow\ 2y^2=4$</p>
      <p data-math-text>$y>0\ \Longrightarrow\ y=\sqrt2,\quad x=2\sqrt2$</p>
      <p data-math-text>$xy=2\sqrt2\cdot\sqrt2=4$</p>
      <p data-math-text>两数均为正，且 $x+2y=4\sqrt2$。下界可以取到。</p>
    </div>
  </template>
  <template id="lesson-completion">
    <section class="completion-card" tabindex="-1"><h2 data-math-text>$x+2y$ 的最小值为 $4\sqrt2$</h2><p data-math-text>当 $x=2\sqrt2,\ y=\sqrt2$ 时取到。</p></section>
  </template>
</body>
</html>
