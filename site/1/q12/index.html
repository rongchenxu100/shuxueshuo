<div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 联立取等条件</span><p data-math-text>$\frac{y}{x}=\frac{x}{y}\ \Longrightarrow\ x^2=y^2$</p><p data-math-text>$x,y>0\ \Longrightarrow\ x=y$</p><p data-math-text>$x=y,\quad x+y=8\ \Longrightarrow\ x=y=4$</p></div><div class="reasoning"><span class="section-label">系统计算 · 验证范围与原条件</span><p data-math-text>$x=4>1,\quad y=4>1$，在换元后的范围内。</p><p data-math-text>$m=\frac{x-1}2=\frac32>0,\quad n=y-1=3>0,\quad 2m+n=6$</p><p data-math-text>$\frac1{2m+1}+\frac1{n+1}=\frac14+\frac14=\frac12$</p></div>
