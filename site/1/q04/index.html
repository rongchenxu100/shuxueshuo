<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f7f5">
  <title>Q04 · 基本不等式 · 数学说</title>
  <link rel="stylesheet" href="/assets/practice/vendor/katex-0.18.9/katex.min.css">
  <link rel="stylesheet" href="/assets/practice/practice.css?v=17">
  <script src="/assets/practice/vendor/katex-0.18.9/katex.min.js" defer></script>
  <script src="/assets/practice/vendor/katex-0.18.9/auto-render.min.js" defer></script>
  <script src="/assets/practice/math-text.js?v=10" defer></script>
  <script src="/assets/practice/components.js?v=13" defer></script>
  <script src="/assets/practice/context.js?v=7" defer></script>
  <script src="/assets/practice/runtime.js?v=11" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="数学说首页"><span class="brand-mark" aria-hidden="true">数</span>数学说</a>
      <span class="demo-label">基本不等式</span>
      <button type="button" class="reset-button" id="reset">↺ <span>重新练习</span></button>
    </div>
  </header>

  <main class="workspace">
    <div class="eyebrow"><span><a class="chapter-return" href="/1/">← 返回题库</a> <span class="separator">/</span> Q04</span></div>
    <section class="problem-card" aria-labelledby="problem-title">
      <h1 id="problem-title">原题</h1>
      <p data-math-text>已知 $x<0$，则 $x+\frac4x-4$ 有（ ）。</p><p class="subtext">A. 最大值 0　　B. 最小值 0</p><p class="subtext">C. 最大值 −8　 D. 最小值 −8</p>
      <section class="meaning-panel" aria-labelledby="meaning-title">
        <div class="meaning-heading"><h2 id="meaning-title">题意整理</h2><span>根据原题转写</span></div>
        <dl class="problem-meaning" aria-label="题意的数学表达">
          <div class="meaning-row"><dt>条件</dt><dd><span data-math-text>$x<0$</span></dd></div>
          <div class="meaning-row"><dt>目标</dt><dd><span data-math-text>判断 $x+\frac4x-4$ 的最值</span></dd></div>
        </dl>
      </section>
    </section>
    <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
    <section id="attempt-history" aria-label="之前的路径尝试"></section>
    <section id="steps" aria-label="逐步解题"></section>
    <div id="completion" hidden></div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <div class="composer-heading"><span class="focus-dot" aria-hidden="true"></span><span id="conversation-focus">正在讨论：整理表达式</span></div>
      <div class="input-shell">
        <textarea id="message" rows="1" placeholder="也可以在这里说说你的思路…" aria-label="你的思路"></textarea>
        <button class="send-button" type="button" disabled aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-5 14-2-6-7-1Zm7 1 7-8"/></svg></button>
      </div>
      <div class="network-feedback"><span id="network-status" role="status" aria-live="polite"></span><button id="request-retry" type="button" hidden>重试</button></div>
    </div>
  </footer>
  <div id="picker" class="token-picker" role="dialog" aria-label="选择数学项" hidden>
    <span class="picker-label">选择数学项</span>
    <div class="picker-options"></div>
  </div>
  <div id="announcement" class="sr-only" aria-live="polite" role="status"></div>

  <script type="application/json" id="practice-config">
{
  "id": "q04",
  "version": 1,
  "variables": [
    "x"
  ],
  "method_question": "这道题，你准备采用哪种解题方案？",
  "methods": [
    {
      "id": "direct",
      "label": "转化为正项后应用基本不等式"
    }
  ],
  "routes": {
    "direct": [
      {
        "id": "rewrite",
        "title": "整理表达式",
        "question": "已知 $x<0$，怎样改写原式，才能使用基本不等式？",
        "interaction": {
          "type": "choice",
          "field": "rewrite_form",
          "options": [
            {
              "value": "positive_sum",
              "label": "$-\\left((-x)+\\left(-\\frac4x\\right)\\right)-4$"
            },
            {
              "value": "lost_outer_minus",
              "label": "$(-x)+\\left(-\\frac4x\\right)-4$"
            },
            {
              "value": "wrong_constant",
              "label": "$-\\left((-x)+\\left(-\\frac4x\\right)\\right)+4$"
            }
          ],
          "description": "positive_sum为正项之和的相反数再减4；lost_outer_minus漏掉整体负号；wrong_constant将常数-4变成+4。"
        },
        "expected_answer": {
          "one_of": [
            "positive_sum"
          ]
        },
        "feedback": {
          "answer": "检查展开后是否仍为 x+4/x−4：前两项提取负号时要保留外面的负号，常数 −4 不变。"
        },
        "submit_label": "确认改写",
        "display": "rewrite-done",
        "preview": {
          "positive_sum": "preview-positive_sum",
          "lost_outer_minus": "preview-lost_outer_minus",
          "wrong_constant": "preview-wrong_constant"
        }
      },
      {
        "id": "amgm",
        "title": "应用基本不等式",
        "question": "对这两个正项应用基本不等式，能得到什么关系？",
        "interaction": {
          "type": "amgm",
          "terms": [
            "x",
            "4/x",
            "-x",
            "-4/x"
          ],
          "positive_terms": [
            "-x",
            "-4/x"
          ],
          "term_labels": {
            "x": "$x$",
            "4/x": "$\\frac4x$",
            "-x": "$-x$",
            "-4/x": "$-\\frac4x$"
          }
        },
        "expected_answer": {
          "terms": [
            "-x",
            "-4/x"
          ]
        },
        "feedback": {
          "terms": "这里使用正数形式的基本不等式。x 与 4/x 均为负，应选择正项 −x、−4/x，且两个位置分别对应这两项。"
        },
        "submit_label": "确认代入",
        "display": "amgm-done"
      },
      {
        "id": "bound",
        "title": "回到原式",
        "question": "两项的和不小于 $4$，取相反数再减 $4$，原式满足什么关系？",
        "interaction": {
          "type": "choice",
          "field": "bound_direction",
          "options": [
            {
              "value": "upper",
              "label": "$x+\\frac4x-4\\le-8$"
            },
            {
              "value": "lower",
              "label": "$x+\\frac4x-4\\ge-8$"
            }
          ],
          "description": "upper表示原式不超过-8；lower表示原式不小于-8。"
        },
        "expected_answer": {
          "one_of": [
            "upper"
          ]
        },
        "feedback": {
          "answer": "整体乘以 −1 时，不等号要反向；再减去4，不改变不等号方向。"
        },
        "submit_label": "确认关系",
        "display": "bound-done",
        "board": "bound-context"
      },
      {
        "id": "equality",
        "title": "验证取等",
        "question": "什么条件下，刚才的基本不等式能取等号？",
        "interaction": {
          "type": "equality",
          "terms": [
            "-x",
            "-4/x"
          ],
          "term_labels": {
            "-x": "$-x$",
            "-4/x": "$-\\frac4x$"
          }
        },
        "expected_answer": {
          "terms": [
            "-x",
            "-4/x"
          ]
        },
        "feedback": {
          "terms": "基本不等式取等时，参与公式的两个正项相等：−x=−4/x。"
        },
        "submit_label": "确认取等",
        "display": "equality-done"
      }
    ]
  },
  "completion": "lesson-completion"
}
  </script>

  <template id="rewrite-done">
    <div class="visual-board completed-visual"><div class="board-caption">整理表达式：提取负号，得到两个正项</div>
      <div class="function-conversion">
        <div><span class="conversion-label">原式</span><div class="math" data-math-text>$x+\frac4x-4$</div></div>
        <span class="conversion-arrow" aria-hidden="true">→</span>
        <div><span class="conversion-label">正项之和的相反数，再减4</span><div class="math" data-math-text>$-\Bigl(\underbrace{(-x)+\left(-\frac4x\right)}_{\text{两个正项的和}}\Bigr)-4$</div></div>
      </div>
    </div>
    <div class="reasoning"><span class="section-label">根据条件，确认正项</span><p data-math-text>$x<0\ \Longrightarrow\ -x>0,\quad -\frac4x>0$</p></div>
  </template>
  <template id="preview-positive_sum"><div class="reasoning choice-preview"><span class="section-label">展开核对</span><p data-math-text>$-\left((-x)+\left(-\frac4x\right)\right)-4=x+\frac4x-4$</p></div></template>
  <template id="preview-lost_outer_minus"><div class="reasoning choice-preview"><span class="section-label">展开核对</span><p data-math-text>$(-x)+\left(-\frac4x\right)-4=-x-\frac4x-4$</p><p>前两项的符号发生了变化，与原式不等价。</p></div></template>
  <template id="preview-wrong_constant"><div class="reasoning choice-preview"><span class="section-label">展开核对</span><p data-math-text>$-\left((-x)+\left(-\frac4x\right)\right)+4=x+\frac4x+4$</p><p>常数变成了 +4，与原式中的 −4 不同。</p></div></template>
  <template id="amgm-done">
    <div data-completed-amgm data-first="{{first}}" data-second="{{second}}" data-first-label="{{first_math}}" data-second-label="{{second_math}}"></div>
    <details class="details" id="{{uid}}-derivation" open><summary>完整推导</summary><p data-math-text>$(-x)\left(-\frac4x\right)=4$</p><p data-math-text>$(-x)+\left(-\frac4x\right)\ge2\sqrt{(-x)\left(-\frac4x\right)}=4$</p></details>
  </template>
  <template id="bound-context"><div class="visual-board completed-visual"><div class="board-caption">已经得到</div><div class="formula" data-math-text>$(-x)+\left(-\frac4x\right)\ge4$</div></div></template>
  <template id="bound-done">
    <div class="visual-board completed-visual"><div class="board-caption">从正项和的下界，得到原式的上界</div><div class="function-conversion"><div><span class="conversion-label">正项之和</span><div class="math" data-math-text>$(-x)+\left(-\frac4x\right)\ge4$</div></div><span class="conversion-arrow" aria-hidden="true">→</span><div><span class="conversion-label">取相反数，再减4</span><div class="math" data-math-text>$x+\frac4x-4\le-8$</div></div></div></div>
    <div class="reasoning"><span class="section-label">系统计算 · 不等号反向</span><p data-math-text>$-\left((-x)+\left(-\frac4x\right)\right)\le-4$</p><p data-math-text>$x+\frac4x-4\le-4-4=-8$</p></div><p class="calculation-note">上界已经得到，还需要检查它能否取到。</p>
  </template>
  <template id="equality-done">
    <div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div>
    <div class="reasoning"><span class="section-label">系统计算 · 验证取等</span><p data-math-text>$-x=-\frac4x\ \Longrightarrow\ x^2=4$</p><p data-math-text>$x<0\ \Longrightarrow\ x=-2$</p><p data-math-text>$-2+\frac4{-2}-4=-8$</p><p>取值满足原条件，上界可以取到。</p></div>
  </template>
  <template id="lesson-completion"><section class="completion-card" tabindex="-1"><h2 data-math-text>$x+\frac4x-4$ 的最大值为 $-8$</h2><p data-math-text>当 $x=-2$ 时取到，选 C。</p></section></template>
</body>
</html>
