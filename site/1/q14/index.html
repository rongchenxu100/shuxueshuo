<div class="visual-board completed-visual"><div class="board-caption">整体乘入定值 1，交叉项积为定值</div><div class="rewrite-equation" data-math-text>$\left(x+\frac1y\right)\left(\frac1x+4y\right)$</div><div class="rewrite-equation"><span>= 5 +</span><span class="shape square expression-slot" data-math-text>$4xy$</span><span>+</span><span class="shape circle expression-slot" data-math-text>$\frac1{xy}$</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 展开整理</span><p data-math-text>$x+\frac1y=\left(x+\frac1y\right)\left(\frac1x+4y\right)$</p><p data-math-text>$=x\cdot\frac1x+x\cdot4y+\frac1y\cdot\frac1x+\frac1y\cdot4y$</p><p data-math-text>$=1+4xy+\frac1{xy}+4=5+4xy+\frac1{xy}$</p><p data-math-text>$x$ 与 $\frac1x$、$\frac1y$ 与 $4y$ 相乘都是常数，剩下的交叉项 $4xy$ 与 $\frac1{xy}$ 积为定值。</p></div>
