  <script type="application/json" id="practice-config">
{
  "id": "q07",
  "version": 1,
  "variables": [
    "x"
  ],
  "method_question": "这道题，你准备采用哪种解题方案？",
  "methods": [
    {
      "id": "matching",
      "label": "凑配后应用基本不等式"
    }
  ],
  "routes": {
    "matching": [
      {
        "id": "rewrite",
        "title": "凑配表达式",
        "question": "已知 $x<0$，怎样把原式改写成根号内两个正项相乘的形式？",
        "interaction": {
          "type": "choice",
          "field": "rewrite_form",
          "options": [
            {
              "value": "negative_root",
              "label": "$-\\sqrt{x^2(9-x^2)}$"
            },
            {
              "value": "positive_root",
              "label": "$\\sqrt{x^2(9-x^2)}$"
            },
            {
              "value": "missing_root",
              "label": "$-x^2(9-x^2)$"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "negative_root"
          ]
        },
        "feedback": {
          "answer": "注意 $\\sqrt{x^2}=|x|=-x$。原式为负，移入根号后要保留根号外的负号。"
        },
        "submit_label": "确认改写",
        "display": "rewrite-done",
        "preview": {
          "negative_root": "preview-negative_root",
          "positive_root": "preview-positive_root",
          "missing_root": "preview-missing_root"
        }
      },
      {
        "id": "structure",
        "title": "观察结构",
        "question": "根号内这两项是定和求积，还是定积求和？",
        "interaction": {
          "type": "structure",
          "terms": [
            "x^2",
            "9-x^2"
          ],
          "term_labels": {
            "x^2": "$x^2$",
            "9-x^2": "$9-x^2$"
          }
        },
        "expected_answer": {
          "terms": [
            "x^2",
            "9-x^2"
          ],
          "fixed": "sum",
          "target": "product"
        },
        "feedback": {
          "terms": "两项应分别为 $x^2$ 与 $9-x^2$。",
          "structure": "固定的是 $x^2+(9-x^2)=9$；先求两项乘积的上界，再代回带负号的原式。"
        },
        "submit_label": "确认结构",
        "display": "structure-done"
      },
      {
        "id": "amgm",
        "title": "应用基本不等式",
        "question": "对这两个正项应用基本不等式，能得到什么关系？",
        "interaction": {
          "type": "amgm",
          "terms": [
            "x^2",
            "9-x^2"
          ],
          "term_labels": {
            "x^2": "$x^2$",
            "9-x^2": "$9-x^2$"
          }
        },
        "expected_answer": {
          "terms": [
            "x^2",
            "9-x^2"
          ]
        },
        "feedback": {
          "terms": "两个位置应分别对应 $x^2$ 和 $9-x^2$。"
        },
        "submit_label": "确认代入",
        "display": "amgm-done"
      },
      {
        "id": "bound",
        "title": "代回原式",
        "question": "代回 $y=-\\sqrt{x^2(9-x^2)}$，能得到什么界？",
        "interaction": {
          "type": "choice",
          "field": "bound_direction",
          "options": [
            {
              "value": "lower",
              "label": "$y\\ge-\\frac92$"
            },
            {
              "value": "upper",
              "label": "$y\\le-\\frac92$"
            },
            {
              "value": "positive",
              "label": "$y\\ge\\frac92$"
            }
          ]
        },
        "expected_answer": {
          "one_of": [
            "lower"
          ]
        },
        "feedback": {
          "answer": "把 $\\sqrt{x^2(9-x^2)}\\le\\frac92$ 两边乘以 $-1$，不等号方向要改变。"
        },
        "submit_label": "确认下界",
        "display": "bound-done",
        "board": "bound-board"
      },
      {
        "id": "equality",
        "title": "验证取等",
        "question": "什么条件下，这个下界可以取到？",
        "interaction": {
          "type": "equality",
          "terms": [
            "x^2",
            "9-x^2"
          ],
          "term_labels": {
            "x^2": "$x^2$",
            "9-x^2": "$9-x^2$"
          }
        },
        "expected_answer": {
          "terms": [
            "x^2",
            "9-x^2"
          ]
        },
        "feedback": {

        },
        "submit_label": "确认取等",
        "display": "equality-done"
      }
    ]

}

<template id="rewrite-done"><div class="visual-board completed-visual"><div class="board-caption">凑配：把两个因子的积移入根号</div><div class="function-conversion"><div><span class="conversion-label">原式</span><div class="math" data-math-text>$x\sqrt{9-x^2}$</div></div><span class="conversion-arrow" aria-hidden="true">→</span><div><span class="conversion-label">保留负号，观察根号内两项</span><div class="formula conversion-terms"><span>−</span><span class="radical"><span class="root-sign">√</span><span class="radicand"><span class="shape square expression-slot" data-math-text>$x^2$</span><span>·</span><span class="shape circle expression-slot" data-math-text>$9-x^2$</span></span></span></div></div></div></div><div class="reasoning"><span class="section-label">根据条件，确认符号</span><p data-math-text>$-3&lt;x&lt;0\ \Longrightarrow\ 0&lt;x^2&lt;9$</p><p data-math-text>$\sqrt{x^2}=|x|=-x$</p><p data-math-text>$y=-\sqrt{x^2}\sqrt{9-x^2}=-\sqrt{x^2(9-x^2)}$</p></div></template>
<template id="preview-negative_root"><div class="reasoning choice-preview"><span class="section-label">核对改写</span><p data-math-text>$x&lt;0\ \Longrightarrow\ x=-\sqrt{x^2}$</p><p data-math-text>$x\sqrt{9-x^2}=-\sqrt{x^2(9-x^2)}$</p></div></template>
<template id="preview-positive_root"><div class="reasoning choice-preview"><span class="section-label">核对改写</span><p data-math-text>$\sqrt{x^2(9-x^2)}=|x|\sqrt{9-x^2}=-x\sqrt{9-x^2}=-y$</p><p data-math-text>这个式子是正数，而原式为负数；根号外还需要一个负号。</p></div></template>
<template id="preview-missing_root"><div class="reasoning choice-preview"><span class="section-label">核对改写</span><p data-math-text>$y^2=x^2(9-x^2)$</p><p data-math-text>平方后的乘积不是原式。恢复原式需要开平方，并根据原式为负选择负号。</p></div></template>
<template id="structure-done"><div class="visual-board completed-visual"><div class="structure-summary"><div class="summary-item"><span class="summary-label">定和</span><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span> + <span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><span class="flow-arrow" aria-hidden="true">→</span><div class="summary-item"><span class="summary-label">求积</span><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span> · <span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div></div></div><div class="reasoning"><span class="section-label">根据你的选择，整理思路</span><p data-math-text>$x^2&gt;0,\quad 9-x^2&gt;0$</p><p data-math-text>$x^2+(9-x^2)=9$</p><p data-math-text>两项的和固定。先求乘积的上界，再利用原式的负平方根形式确定下界。</p></div></template>
<template id="amgm-done"><div data-completed-amgm data-first="{{first}}" data-second="{{second}}" data-first-label="{{first_math}}" data-second-label="{{second_math}}"></div><details class="details" id="{{uid}}-derivation" open><summary>完整推导</summary><p data-math-text>$9=x^2+(9-x^2)\ge2\sqrt{x^2(9-x^2)}$</p><p data-math-text>$\sqrt{x^2(9-x^2)}\le\frac92$</p></details><p class="calculation-note">得到的是平方根的上界，还需要代回带负号的原式。</p></template>
<template id="bound-board"><div class="visual-board"><div class="board-caption">已经得到的关系</div><div class="formula" data-math-text>$\sqrt{x^2(9-x^2)}\le\frac92$</div></div></template>
<template id="bound-done"><div class="visual-board completed-visual"><div class="board-caption">取负号：从上界转为下界</div><div class="function-conversion"><div><span class="conversion-label">平方根的上界</span><div class="math" data-math-text>$\sqrt{x^2(9-x^2)}\le\frac92$</div></div><span class="conversion-arrow" aria-hidden="true">→</span><div><span class="conversion-label">原式的下界</span><div class="math" data-math-text>$y\ge-\frac92$</div></div></div></div><div class="reasoning"><span class="section-label">两边乘以负数，不等号反向</span><p data-math-text>$y=-\sqrt{x^2(9-x^2)}\ge-\frac92$</p></div><p class="calculation-note">下界已经得到，还需要检查它能否取到。</p></template>
<template id="equality-done"><div class="visual-board completed-visual"><div class="board-caption">基本不等式取等</div><div class="formula"><span class="shape square expression-slot" data-math-text>{{first_math}}</span><span class="equal-sign">=</span><span class="shape circle expression-slot" data-math-text>{{second_math}}</span></div></div><div class="reasoning"><span class="section-label">系统计算 · 验证取等</span><p data-math-text>$x^2=9-x^2\ \Longrightarrow\ x^2=\frac92$</p><p data-math-text>$-3&lt;x&lt;0\ \Longrightarrow\ x=-\frac{3\sqrt2}{2}$</p><p data-math-text>$y=-\sqrt{\frac92\cdot\frac92}=-\frac92$</p><p data-math-text>这个取值位于原题的开区间内，下界可以取到。</p></div></template>
<template id="lesson-completion"><section class="completion-card" tabindex="-1"><h2 data-math-text>$y=x\sqrt{9-x^2}$ 的最小值为 $-\frac92$</h2><p data-math-text>当 $x=-\frac{3\sqrt2}{2}$ 时取到。</p></section></template>
